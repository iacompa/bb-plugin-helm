    <div class="glass zoomctl"><button class="iconbtn sm" data-act="zoom-out" aria-label="Zoom out">${ic('minus', 'sm')}</button><span class="zl" id="zl">${Math.round(G.zoom * 100)}%</span><button class="iconbtn sm" data-act="zoom-in" aria-label="Zoom in">${ic('plus', 'sm')}</button><button class="iconbtn sm" data-act="fit" aria-label="Fit to screen" title="Fit to screen">${ic('fit', 'sm')}</button><button class="iconbtn sm" data-act="help" aria-label="Gestures and shortcuts" title="Gestures and shortcuts"><b style="font:700 12px var(--font-ui)">?</b></button></div>`;
  const lg = (cls, label, extra = '') => `<span class="lgi"><i class="dot ${cls} ${extra}" style="--st:var(--${cls === 's-running' ? 'running' : 'idle'})"></i>${label}</span>`;
  $('#gLegend').innerHTML = `<div class="glass legend">
    <span class="lgi s-running"><i class="dot s-running"></i>Running</span>
    <span class="lgi s-waiting"><i class="dot s-waiting"></i>Waiting</span>
    <span class="lgi s-queued"><i class="dot s-queued"></i>Queued</span>
    <span class="lgi s-needs"><i class="dot s-needs"></i>Needs you</span>
    <span class="lgi s-failed"><i class="dot s-failed"></i>Failed</span>
    <span class="lgi s-done"><i class="dot s-done"></i>Done</span>
    <span class="lgi s-planned"><i class="dot s-planned"></i>Planned</span>
    <span class="lgi"><span class="touchb" style="position:static;height:16px">${ic('hand')}you</span>changed by you</span>
  </div>`;
  $('#gHint').innerHTML = `<div class="hint">${a ? 'Click an agent to inspect or change it · ' : 'Double-click an app to open its squad · '}Drag to pan · <span class="kbd">⌘</span>/<span class="kbd">Ctrl</span> + scroll to zoom</div>`;
}

/* ───────── pan / zoom ───────── */
function applyTransform(animate) {
  const st = $('#stage'); if (!st) return;
  if (animate) { st.classList.add('anim'); clearTimeout(G.animT); G.animT = setTimeout(() => st.classList.remove('anim'), 420); }
  st.style.transform = `translate(${G.px}px,${G.py}px) scale(${G.zoom})`;
  $('#canvas').dataset.lod = G.zoom < 0.6 ? 'low' : G.zoom < 0.82 ? 'mid' : 'high';
  const zl = $('#zl'); if (zl) zl.textContent = Math.round(G.zoom * 100) + '%';
  updateActionBar();
}
function fitView(animate = true) {
  const cv = $('#canvas'); if (!cv || !G.L) return;
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const b = G.L.bounds, padX = 44, top = 92, bot = 56;
  const aw = r.width - padX * 2, ah = r.height - top - bot;
  const z = clamp(Math.min(aw / b.w, ah / b.h), 0.28, 1);
  G.zoom = z; G.px = (r.width - b.w * z) / 2; G.py = top + (ah - b.h * z) / 2;
  G.auto = true;
  applyTransform(animate);
}
function zoomAt(cx, cy, nz) {
  const r = $('#canvas').getBoundingClientRect();
  nz = clamp(nz, 0.25, 1.8);
  const x = cx - r.left, y = cy - r.top;
  G.px = x - (x - G.px) * (nz / G.zoom); G.py = y - (y - G.py) * (nz / G.zoom); G.zoom = nz; G.auto = false;
  applyTransform(false);
}
function centerOn(id, animate = true) {
  const rc = rectOf(id); if (!rc) return;
  const r = $('#canvas').getBoundingClientRect();
  G.px = r.width / 2 - (rc.x + rc.w / 2) * G.zoom; G.py = r.height / 2 - (rc.y + rc.h / 2) * G.zoom; G.auto = false;
  applyTransform(animate);
}

function initGraph() {
  const cv = $('#canvas');
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, G.zoom * Math.exp(-e.deltaY * 0.0022));
    else { G.px -= e.deltaX; G.py -= e.deltaY; G.auto = false; applyTransform(false); }
  }, { passive: false });
  cv.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.node,.abar,.glass,button,input')) return;
    G.pan = { x: e.clientX, y: e.clientY, px: G.px, py: G.py, moved: false };
    cv.setPointerCapture(e.pointerId); cv.classList.add('panning');
  });
  cv.addEventListener('pointermove', e => {
    if (!G.pan) return;
    const dx = e.clientX - G.pan.x, dy = e.clientY - G.pan.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { G.pan.moved = true; G.auto = false; }
    G.px = G.pan.px + dx; G.py = G.pan.py + dy; applyTransform(false);
  });
  const end = e => { if (!G.pan) return; G.pan = null; cv.classList.remove('panning'); try { cv.releasePointerCapture(e.pointerId); } catch (_) { } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  new ResizeObserver(() => { if (G.auto && S.view === 'graph') fitView(false); }).observe(cv);
  cv.addEventListener('click', e => {
    const el = e.target.closest('.node'); if (!el || e.target.closest('[data-act]')) return;
    const id = el.dataset.id;
    if (el.dataset.k === 'app') selectNode(S.appById[id].lead);
    else if (el.dataset.k === 'ghost') selectNode(id);
    else selectNode(id);
  });
  cv.addEventListener('dblclick', e => {
    const el = e.target.closest('.node'); if (!el) return;
    if (el.dataset.k === 'app') drillInto(el.dataset.id);
    else if (el.dataset.k === 'mgr' && !S.drill) ACT['toggle-collapse'](el, e, el.dataset.id);
  });
  cv.addEventListener('keydown', e => {
    const el = e.target.closest?.('.node'); if (!el) return;
    if (e.key === 'Enter') { e.preventDefault(); el.click(); if (el.dataset.k === 'app' && (e.shiftKey || e.metaKey)) drillInto(el.dataset.id); }
  });
  cv.addEventListener('input', e => { if (e.target.id === 'gSearch') { S.filter = e.target.value; applyFilterClasses(); } });
  cv.addEventListener('keydown', e => {
    if (e.target.id === 'gSearch' && e.key === 'Enter') { const hit = firstMatch(); if (hit) focusNode(hit); }
    if (e.target.id === 'gSearch' && e.key === 'Escape') { e.target.value = ''; S.filter = ''; applyFilterClasses(); e.target.blur(); }
  });
}

/* ───────── filtering ───────── */
function matchNode(id) {
  const q = S.filter.trim().toLowerCase();
  let ok = true;
  const app = S.appById[id], n = S.nodes[id], o = S.obs[id];
  if (S.sf !== 'all') {
    if (app) { const st = appStatus(app); ok = S.sf === 'running' ? st === 'running' : S.sf === 'needs' ? st === 'needs' : appHasTouch(app); }
    else if (n) ok = S.sf === 'running' ? n.status === 'running' : S.sf === 'needs' ? ['needs', 'failed'].includes(n.status) : n.touched;
    else ok = !!o && S.sf === 'running' && o.status === 'running';
  }
  if (ok && q) {
    let hay = '';
    if (app) hay = [app.name, app.tag, S.mgrById[app.mgr].name, app.plat.map(p => PLAT[p]).join(' '), stageLabel(app.stage)].join(' ');
    else if (n) hay = [n.label, n.sub, ROLE_LABEL[n.rk] || '', mdl(n.model).name, mdl(n.model).id, n.model.r, n.now, ST[n.status]].join(' ');
    else if (o) hay = [o.title, o.project, mdl(o.model).name].join(' ');
    ok = hay.toLowerCase().includes(q);
  }
  return ok;
}
function applyFilterClasses() {
  const active = !!S.filter.trim() || S.sf !== 'all';
  $$('#stage .node').forEach(el => { const m = matchNode(el.dataset.id); el.classList.toggle('dim', active && !m); el.classList.toggle('hit', active && m && !!S.filter.trim()); });
}
function firstMatch() {
  const ids = Object.keys(G.L.rects).filter(id => matchNode(id));
  return ids.find(id => id !== 'orch') || ids[0];
}

/* ───────── drill, focus, select ───────── */
function drillInto(appId) {
  S.drill = appId; S.view = 'graph';
  selectNode(S.appById[appId].lead, { quiet: true });
  renderAll(); fitView(false);
}
function drillOut() { S.drill = null; renderAll(); fitView(false); }
function focusNode(id) {
  const n = S.nodes[id];
  S.view = 'graph';
  if (n && n.appId) S.drill = n.appId; else S.drill = null;
  selectNode(id, { quiet: true });
  renderAll(); fitView(false);
}

function resetDraft(type) {
  S.draft = { type: type || 'tell', text: '', cascade: 'self', mode: 'steer', policy: false, model: null, priority: 'high', scope: '' };
}
function selectNode(id, o = {}) {
  if (!node(id)) return;
  const changed = S.sel !== id;
  S.sel = id;
  if (o.tab) S.tab = o.tab;
  if (changed || o.dtype) resetDraft(o.dtype);
  S.inspectorOpen = true;
  if (!o.quiet) { markSelection(); updateActionBar(); }
  renderInspector();
  if (S.view === 'board') markBoardSel();
}

/* ───────── action bar over the selected node ───────── */
function updateActionBar() {
  const bar = $('#abar'); if (!bar || !G.L) return;
  if (S.view !== 'graph') { bar.hidden = true; return; }
  const sel = S.sel; const n = S.nodes[sel];
  let rid = null;
  if (n && n.kind === 'lead' && !S.drill) rid = n.appId;
  else if (G.L.rects[sel]) rid = sel;
  const r = rid && G.L.rects[rid];
  if (!r) { bar.hidden = true; return; }   /* e.g. the app sits inside a collapsed manager */
  let btns = '';
  const isApp = !!S.appById[rid];
  if (S.obs[sel]) btns = `<button data-act="adopt" data-id="${sel}">${ic('plus', 'sm')} Adopt into run</button><button data-act="open-thread" data-id="${sel}">${ic('open', 'sm')} Open thread</button>`;
  else {
    const t = isApp ? S.nodes[S.appById[rid].lead] : n;
    const paused = t.status === 'paused';
    btns = (isApp ? `<button data-act="drill" data-id="${rid}">${ic('graph', 'sm')} Open squad</button><span class="sepv"></span>` : '')
      + `<button data-act="bar-tell" data-id="${t.id}">${ic('chat', 'sm')} Tell</button>`
      + `<button data-act="bar-model" data-id="${t.id}">${ic('cpu', 'sm')} Model</button>`
      + (t.status === 'planned' ? '' : `<button data-act="bar-pause" data-id="${t.id}">${ic(paused ? 'play' : 'pause', 'sm')} ${paused ? 'Resume' : 'Pause'}</button>`)
      + `<button data-act="bar-direct" data-id="${t.id}">${ic('sliders', 'sm')} More…</button>`;
  }
  const below = !!S.drill && rid === S.appById[S.drill].lead;
  bar.innerHTML = btns; bar.hidden = false; bar.classList.toggle('below', below);
  bar.style.left = (r.x + r.w / 2) + 'px'; bar.style.top = (below ? r.y + r.h + 12 : r.y - 12) + 'px';
  bar.style.transform = `translate(-50%,${below ? '0' : '-100%'}) scale(${1 / G.zoom})`;
}

/* ───────── effects: ripple / particle / "notified" chips ───────── */
function fx() { return $('#fx'); }
function stageEl(cls, html, style) { const d = document.createElement('div'); d.className = cls; d.style.cssText = style || ''; if (html) d.innerHTML = html; fx()?.appendChild(d); return d; }
function ripple(id) {
  const r = rectOf(visIdOf(id) || id); if (!r) return;
  const d = stageEl('ripple', '', `left:${r.x - 3}px;top:${r.y - 3}px;width:${r.w + 6}px;height:${r.h + 6}px`);
  d.addEventListener('animationend', () => d.remove());
}
function notifiedChip(id, text) {
  const vid = visIdOf(id); const r = vid && rectOf(vid); if (!r) return;
  const d = stageEl('notified', ic('check', 'sm') + esc(text), `left:${r.x + r.w / 2}px;top:${r.y - 6}px;transform:translate(-50%,-100%) scale(${1 / G.zoom});transform-origin:50% 100%`);
  setTimeout(() => d.remove(), 2700);
}
function particleAlong(fromId, toId, ms, done) {
  const a = rectOf(fromId), b = rectOf(toId);
  if (!a || !b) { done && done(); return; }
  const svg = $('#stage .edges'); if (!svg) { done && done(); return; }
  const vertical = !!(S.drill && (G.L.edges.find(e => e.from === toId && e.to === fromId && e.kind === 'v')));
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const d = vertical ? pathD(b, a, 'v') : pathD(b, a, '');
  p.setAttribute('d', d); p.style.cssText = 'stroke:var(--human);stroke-width:2.6;fill:none;opacity:.0;transition:opacity .15s'; svg.appendChild(p);
  requestAnimationFrame(() => p.style.opacity = '.85');
  const len = p.getTotalLength();
  const dot = stageEl('particle', '', 'left:0;top:0');
  const t0 = performance.now();
  const step = now => {
    const k = clamp((now - t0) / ms, 0, 1), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const pt = p.getPointAtLength(len * (1 - e));   /* travel from child up to parent */
    dot.style.left = pt.x + 'px'; dot.style.top = pt.y + 'px';
    if (k < 1) requestAnimationFrame(step); else { dot.remove(); setTimeout(() => p.remove(), 500); done && done(); }
  };
  requestAnimationFrame(step);
}

function propagate(d) {
  if (S.view !== 'graph' || !G.L) return;
  const chain = [d.target, ...ancestors(d.target)];
  const vis = chain.map(id => visIdOf(id)).filter((v, i, arr) => v && arr.indexOf(v) === i);
  if (!vis.length) return;
  ripple(vis[0]);
  notifiedChip(vis[0], 'You · ' + TYPE_LABEL[d.type]);
  vis.slice(1).forEach((to, i) => {
    const from = vis[i];
    G.fxTimers.push(setTimeout(() => {
      particleAlong(from, to, 560, () => {
        ripple(to);
        const who = to === 'orch' ? 'Orchestrator' : S.appById[to] ? S.appById[to].name + ' lead' : nodeLabel(S.nodes[to]);
        const r = d.recipients.find(r => r.id === to || (S.appById[to] && r.id === S.appById[to].lead));
        notifiedChip(to, who + ' · ' + (r?.world && to === 'orch' ? 'world state' : r?.level === 'full' ? 'full notice' : 'digest'));
      });
    }, 260 + i * 700));
  });
}

'use strict';
/* ════════════════════════════════════════════════════════════════
   Board: apps-by-stage and tasks-by-status, with drag rules
   ════════════════════════════════════════════════════════════════ */

const TASK_COLS = [
  { id: 'planned', label: 'Planned', hint: 'Not spawned yet' },
  { id: 'queued',  label: 'Queued / held', hint: 'Waiting for capacity, or paused by you' },
  { id: 'running', label: 'Running', hint: '' },
  { id: 'waiting', label: 'Waiting', hint: 'On children, a gate, or fixes' },
  { id: 'needs',   label: 'Needs you', hint: 'Approvals, questions, failures' },
  { id: 'done',    label: 'Done', hint: '' },
];
const colOfStatus = s => ({ planned: 'planned', queued: 'queued', paused: 'queued', idle: 'queued', running: 'running', waiting: 'waiting', needs: 'needs', failed: 'needs', done: 'done' })[s] || 'queued';

function renderBoard() {
  const el = $('#v-board'); if (!el) return;
  const apps = S.lens === 'apps';
  const counts = S.apps.reduce((m, a) => (m[a.stage] = (m[a.stage] || 0) + 1, m), {});
  const head = `<div class="bhead">
    <h2>Board</h2>
    <div class="seg"><button data-act="lens" data-v="apps" class="${apps ? 'on' : ''}">${ic('layers', 'sm')} Apps by stage</button><button data-act="lens" data-v="tasks" class="${apps ? '' : 'on'}">${ic('board', 'sm')} Agent tasks</button></div>
    ${apps
      ? `<label class="check" style="align-items:center"><input type="checkbox" data-act="swim" ${S.swim ? 'checked' : ''}> Swimlanes by manager</label>`
      : `<select class="select" data-act="task-app" aria-label="Filter by app" style="width:160px"><option value="all">All apps</option>${S.apps.map(a => `<option value="${a.id}" ${S.taskApp === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>`}
    <label class="check" style="align-items:center"><input type="checkbox" data-act="hide-done" ${S.hideDone ? 'checked' : ''}> Hide done</label>
    <span class="grow"></span>
    <span class="muted" style="font-size:12px">${apps ? `${S.apps.length} apps · ${counts.build || 0} building · ${(counts.review || 0) + (counts.slop || 0)} in gates · ${counts.ready || 0} ready` : `${Object.values(S.nodes).filter(n => n.kind !== 'orch' && n.kind !== 'mgr').length} agents across ${S.apps.length} apps`}</span>
  </div>
  <div class="rulebar">${ic('alert', 'sm')}<span>${apps
      ? '<b>Stages advance on evidence, not on drag.</b> You can sign off a Ready app (→ Done), send it back to Build with a reason, or start an Intake app now. Anything else snaps back.'
      : '<b>You can start or hold work.</b> Drag Planned or Queued to Running to start it now, or Running to Queued to hold it. Approvals and failures are resolved in <b>Needs you</b>.'}</span></div>`;
  el.innerHTML = `<div class="boardwrap">${head}<div class="bscroll">${apps ? appsLens() : tasksLens()}</div></div>`;
  markBoardSel();
}

/* ───────── apps lens ───────── */
function appBoardCard(a) {
  const st = appStatus(a), mg = S.mgrById[a.mgr];
  const dots = a.members.map(mid => { const m = S.nodes[mid]; return `<i class="dot s-${m.status}${m.touched ? ' touched' : ''}" title="${esc(m.label)} · ${ST[m.status]}"></i>`; }).join('');
  const nNeed = needsFor(n => n && n.appId === a.id), nTouch = appTouchCount(a);
  return `<div class="bcard s-${st}" draggable="true" data-kind="app" data-app="${a.id}" data-id="${a.lead}" tabindex="0">
    <div class="row" style="gap:6px"><b class="b-name">${esc(a.name)}</b><span class="grow"></span>
      ${nNeed ? `<span class="pill warn" title="Needs you">${ic('bell', 'sm')}${nNeed}</span>` : ''}
      ${nTouch ? `<span class="pill human" title="Changed by you">${ic('hand', 'sm')}${nTouch}</span>` : ''}
    </div>
    <div class="b-sub">${esc(a.tag)}</div>
    <div class="dots">${dots}</div>
    <div class="b-foot"><span class="mtag"><i style="background:${mg.hue}"></i>${esc(mg.name)}</span>
      <span class="plt">${a.plat.map(p => `<i>${PLAT_SHORT[p]}</i>`).join('')}</span>
      <span class="mono muted" style="font-size:10.5px">${a.pct}%</span></div>

}

function appsLens() {
  const stages = S.hideDone ? STAGES.filter(s => s.id !== 'done') : STAGES;
  const n = stages.length;
  const cols = `repeat(${n}, minmax(160px, 1fr))`;
  const byCell = (sid, mid) => S.apps.filter(a => a.stage === sid && (!mid || a.mgr === mid)).map(appBoardCard).join('');
  const colHead = s => `<div class="ch" title="${esc(s.hint)}">${esc(s.label)}<span class="count">${S.apps.filter(a => a.stage === s.id).length}</span></div>`;
  if (!S.swim) {
    return `<div class="bgrid" style="grid-template-columns:${cols}">${stages.map(s => `<div class="bcol" data-drop="app" data-stage="${s.id}">
      <div class="bcol-h" title="${esc(s.hint)}">${esc(s.label)}<span class="count">${S.apps.filter(a => a.stage === s.id).length}</span></div>
      <div class="bcol-b">${byCell(s.id) || '<div class="faint" style="font-size:11.5px;padding:4px 2px">—</div>'}</div></div>`).join('')}</div>`;
  }
  const gc = `134px ${cols}`;
  return `<div class="colhead-row" style="grid-template-columns:${gc}"><div></div>${stages.map(colHead).join('')}</div>`
    + S.mgrs.map(m => {
      const as = m.apps.map(id => S.appById[id]);
      const run = as.filter(a => appStatus(a) === 'running').length;
      return `<div class="swim" style="grid-template-columns:${gc}">
        <div class="swimlabel" style="border-left:3px solid ${m.hue}"><b>${esc(m.name)}</b><span class="muted" style="font-size:11.5px">${plural(as.length, 'app')} · ${run} running</span><button class="btn sm ghost" data-act="goto" data-id="${m.id}" style="justify-content:flex-start;padding:0;height:22px;color:var(--accent)">Manager ${ic('chev', 'sm')}</button></div>
        ${stages.map(s => `<div class="cell" data-drop="app" data-stage="${s.id}" data-mgr="${m.id}">${byCell(s.id, m.id)}</div>`).join('')}</div>`;
    }).join('');
}

/* ───────── tasks lens ───────── */
function taskCard(n) {
  const a = appOf(n); const st = n.status;
  const diff = ['planned', 'queued'].includes(st) ? '' : `<span class="mono muted" style="font-size:10.5px">+${100 + hash(n.id) % 400} −${hash(n.id) % 60}</span>`;
  return `<div class="bcard s-${st}" draggable="true" data-kind="task" data-id="${n.id}" tabindex="0">
    <div class="row" style="gap:7px">${roleTile(n)}<div class="grow" style="min-width:0"><b class="b-name" style="font-size:13px;display:block" >${esc(n.label)}</b><span class="b-sub" style="font-size:11px">${esc(a.name)} · ${esc(S.mgrById[n.mgrId].name)}</span></div>
      ${n.touched ? `<span class="pill human" title="Changed by you">${ic('hand', 'sm')}</span>` : ''}</div>
    <div class="b-sub" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(n.now)}</div>
    <div class="b-foot">${modelChip(n.model, { cls: st === 'planned' ? 'planned' : '' })}${diff}</div>
  </div>`;
}
const ORDER = { needs: 0, failed: 0, running: 1, waiting: 2, queued: 3, paused: 3, idle: 3, planned: 4, done: 5 };
function tasksLens() {
  const all = Object.values(S.nodes).filter(n => n.kind !== 'orch' && n.kind !== 'mgr' && (S.taskApp === 'all' || n.appId === S.taskApp));
  const cols = S.hideDone ? TASK_COLS.filter(c => c.id !== 'done') : TASK_COLS;
  return `<div class="bgrid" style="grid-template-columns:repeat(${cols.length},minmax(236px,1fr))">${cols.map(c => {
    const items = all.filter(n => colOfStatus(n.status) === c.id).sort((a, b) => (ORDER[a.status] - ORDER[b.status]) || ((b.prio === 'high') - (a.prio === 'high')) || a.id.localeCompare(b.id));
    const LIM = 14; const open = S.expanded['t-' + c.id];
    const shown = open ? items : items.slice(0, LIM);
    return `<div class="bcol" data-drop="task" data-col="${c.id}">
      <div class="bcol-h" title="${esc(c.hint)}">${esc(c.label)}<span class="count">${items.length}</span></div>

      ${items.length > LIM && !open ? `<button class="more" data-act="more" data-v="t-${c.id}">+${items.length - LIM} more</button>` : ''}</div></div>`;

}

/* ───────── drag & drop rules ───────── */
function appMoveRule(a, to) {
  const from = a.stage;
  if (from === to) return { ok: true, noop: true };
  if (from === 'ready' && to === 'done') return { ok: true, act: 'signoff', label: 'Sign off' };
  if (from === 'ready' && to === 'build') return { ok: true, act: 'sendback', label: 'Send back to Build' };
  if (from === 'intake' && to === 'spec') return { ok: true, act: 'start', label: 'Start now' };
  if (from === 'done' && to === 'ready') return { ok: true, act: 'reopen', label: 'Reopen' };
  if (from === 'ready' || from === 'done') return { ok: false, why: `${stageLabel(from)} apps can be signed off or sent back to Build — not moved to ${stageLabel(to)}.` };
  if (STAGE_IDX[to] > STAGE_IDX[from]) return { ok: false, why: `${a.name} moves to ${stageLabel(to)} when its ${from === 'build' ? 'builders finish and integration checks pass' : from === 'review' ? 'Reviewer passes' : from === 'slop' ? 'Slop Hunter passes' : 'work completes'} — stages advance on evidence, not on drag.` };
  return { ok: false, why: `Stages don’t run backwards by drag. To redo work, send the app back from Ready, or tell its lead what to redo.` };
}
function taskMoveRule(n, to) {
  const from = colOfStatus(n.status);
  if (from === to) return { ok: true, noop: true };
  if ((from === 'planned' || from === 'queued') && to === 'running') return { ok: true, act: 'start', label: n.status === 'planned' ? 'Spawn and start now' : 'Start now' };
  if (from === 'planned' && to === 'queued') return { ok: true, act: 'spawn', label: 'Spawn (queue)' };
  if (from === 'running' && to === 'queued') return { ok: true, act: 'hold', label: 'Hold' };
  if (from === 'needs') return { ok: false, why: 'This is waiting on you — resolve it in Needs you, then it moves on its own.' };
  if (from === 'done') return { ok: false, why: 'Done work is final. To redo it, tell the lead what to change.' };
  if (to === 'done' || to === 'waiting' || to === 'needs') return { ok: false, why: 'Agents move to ' + TASK_COLS.find(c => c.id === to).label + ' when they report it, not by drag.' };
  return { ok: false, why: 'That move isn’t something you can force.' };
}

function bindBoard() {
  const root = $('#v-board');
  let cur = null;
  root.addEventListener('dragstart', e => {
    const c = e.target.closest('.bcard'); if (!c) return;
    S.drag = { kind: c.dataset.kind, id: c.dataset.kind === 'app' ? c.dataset.app : c.dataset.id };
    c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', S.drag.id);
  });
  root.addEventListener('dragend', () => { S.drag = null; cur = null; $$('#v-board .dragging,#v-board .drop-ok,#v-board .drop-no').forEach(x => x.classList.remove('dragging', 'drop-ok', 'drop-no')); });
  root.addEventListener('dragover', e => {
    const z = e.target.closest('[data-drop]'); if (!z || !S.drag || z.dataset.drop !== S.drag.kind) return;
    e.preventDefault();
    const r = S.drag.kind === 'app' ? appMoveRule(S.appById[S.drag.id], z.dataset.stage) : taskMoveRule(S.nodes[S.drag.id], z.dataset.col);
    if (cur && cur !== z) cur.classList.remove('drop-ok', 'drop-no');
    cur = z; z.classList.toggle('drop-ok', r.ok && !r.noop); z.classList.toggle('drop-no', !r.ok);
    e.dataTransfer.dropEffect = r.ok ? 'move' : 'none';
  });
  root.addEventListener('dragleave', e => { const z = e.target.closest('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drop-ok', 'drop-no'); });
  root.addEventListener('drop', e => {
    const z = e.target.closest('[data-drop]'); if (!z || !S.drag) return;
    e.preventDefault(); z.classList.remove('drop-ok', 'drop-no');
    const d = S.drag; S.drag = null;
    if (d.kind === 'app') dropApp(S.appById[d.id], z.dataset.stage);
    else dropTask(S.nodes[d.id], z.dataset.col);
  });
  root.addEventListener('click', e => {
    const c = e.target.closest('.bcard'); if (!c || e.target.closest('[data-act]')) return;
    selectNode(c.dataset.kind === 'app' ? S.appById[c.dataset.app].lead : c.dataset.id);
  });
  root.addEventListener('dblclick', e => { const c = e.target.closest('.bcard'); if (c && c.dataset.kind === 'app') drillInto(c.dataset.app); });
}

function snapBack(why) { toast('Snapped back', { kind: 'warn', sub: why }); renderBoard(); }

function dropApp(a, to) {
  const r = appMoveRule(a, to);
  if (r.noop) return;
  if (!r.ok) return snapBack(r.why);
  if (r.act === 'signoff') return confirmModal({ title: `Sign off ${a.name}?`, body: `Reviewer ✓ · Slop Hunter ✓ · deterministic checks ✓. Signing off archives the squad’s threads and marks ${a.name} done. The Orchestrator and the ${S.mgrById[a.mgr].name} manager are told.`, ok: 'Sign off', cls: 'ok', fn: () => doSignoff(a) }, () => renderBoard());
  if (r.act === 'sendback') return reasonModal({ title: `Send ${a.name} back to Build`, ph: 'What should change? The lead and the Orchestrator will see exactly this.', ok: 'Send back', fn: txt => doSendBack(a, txt) }, () => renderBoard());
  if (r.act === 'start') { doStartApp(a); return; }
  if (r.act === 'reopen') { directive({ type: 'tell', target: a.lead, text: 'Reopened by the human.' }); a.stage = 'ready'; S.nodes[a.lead].status = 'needs'; refreshAll(); toast(`${a.name} reopened`, { sub: 'Back in Ready.' }); }
}

function resolveNeeds(pred) { S.needs.forEach(n => { if (!n.done && pred(n)) n.done = true; }); }

function doSignoff(a) {
  const d = directive({ type: 'signoff', target: a.lead, text: 'all gates green' });
  a.stage = 'done'; a.pct = 100; a.members.forEach(id => { const m = S.nodes[id]; if (m.status !== 'planned') { m.status = 'done'; m.now = nowText(m, a, S.nodes); } });
  resolveNeeds(n => n.node === a.lead);
  refreshAll(); propagateSoon(d);
  toast(`${a.name} signed off`, { sub: `Orchestrator and ${S.mgrById[a.mgr].name} manager notified.` });
}
function doSendBack(a, txt) {
  const d = directive({ type: 'sendback', target: a.lead, text: txt });
  a.stage = 'build'; a.pct = Math.min(a.pct, 70);
  const lead = S.nodes[a.lead]; lead.status = 'running'; lead.now = 'Reading your send-back note and re-planning: ' + txt.slice(0, 50);
  [a.review, a.slop].forEach(id => { const g = S.nodes[id]; g.status = 'planned'; g.now = nowText(g, a, S.nodes); });
  resolveNeeds(n => n.node === a.lead);
  refreshAll(); propagateSoon(d);
  toast(`${a.name} sent back to Build`, { sub: 'Gates reset; the lead is re-planning.' });
}
function doStartApp(a) {
  const d = directive({ type: 'tell', target: a.lead, text: 'Start now — do not wait for a free spec slot.' });
  a.stage = 'spec'; a.pct = 4; const lead = S.nodes[a.lead]; lead.status = 'running'; lead.now = 'Starting: reading the app brief, drafting SPEC.md';
  refreshAll(); propagateSoon(d);
  toast(`${a.name} started`, { sub: 'Moved from Intake to Spec ahead of the queue.' });
}

function dropTask(n, to) {
  const r = taskMoveRule(n, to);
  if (r.noop) return;
  if (!r.ok) return snapBack(r.why);
  if (r.act === 'hold') {
    const d = directive({ type: 'pause', target: n.id, text: 'held from the board' }); refreshAll(); propagateSoon(d);
    toast(`${nodeLabel(n)} held`, { sub: 'It keeps its worktree and resumes when you release it.' });
  } else {
    const wasPlanned = n.status === 'planned';
    const full = runningCount() >= S.cap;
    const d = directive({ type: wasPlanned ? 'spawn' : 'resume', target: n.id, text: 'start now' });
    if (wasPlanned) { n.status = 'queued'; n.prevStatus = 'queued'; }
    if (r.act !== 'spawn' || !wasPlanned) { if (!full) { n.status = 'running'; n.now = nowText(n, appOf(n), S.nodes); n.started = 1; } else { n.status = 'queued'; n.now = 'Queued first in line · capacity is full (' + runningCount() + '/' + S.cap + ')'; } }
    else n.now = 'Queued · spawned by you from the board';
    refreshAll(); propagateSoon(d);
    toast(full && r.act !== 'spawn' ? `Capacity is full (${runningCount()}/${S.cap})` : `${nodeLabel(n)} ${r.act === 'spawn' ? 'spawned' : 'started'}`, { sub: full && r.act !== 'spawn' ? 'It is first in line and starts as soon as a slot frees up.' : 'Its lead and manager were told.', kind: full && r.act !== 'spawn' ? 'warn' : '' });
  }
}

  const live = !['planned', 'queued'].includes(n.status);
  h += sec('Run', `<div class="statrow">
      <div class="stat"><b>${live ? fmtTok(n.tokens) : '—'}</b><span>tokens</span></div>
      <div class="stat"><b>${live ? n.turns : '—'}</b><span>turns</span></div>
      <div class="stat"><b>${live ? fmtMoney(n.cost) : '—'}</b><span>cost so far</span></div>
      <div class="stat"><b>${live ? (n.started >= 60 ? Math.floor(n.started / 60) + 'h ' + (n.started % 60) + 'm' : n.started + 'm') : '—'}</b><span>running</span></div></div>
    <dl class="kv" style="margin-top:12px">
      <dt>Role</dt><dd>${esc(roleText(n))} <span class="muted">· model slot “${esc(n.slot)}”${n.override ? ' (overridden)' : ''}</span></dd>
      ${n.parent ? `<dt>Reports to</dt><dd><button data-act="goto" data-id="${n.parent}" style="color:var(--accent);font-weight:600">${esc(trailLabel(n.parent))}</button></dd>` : ''}
      <dt>Model</dt><dd>${esc(mdl(n.model).name)} <span class="mono muted">${esc(mdl(n.model).id)}</span> · ${esc(REASON[n.model.r] || '—')}</dd>
      <dt>Provider</dt><dd>${esc(PROVIDERS[mdl(n.model).provider].label)} <span class="muted">· My Mac</span></dd>
      ${n.branch ? `<dt>Branch</dt><dd class="mono" style="font-size:11.5px">${ic('branch', 'sm')} ${esc(n.branch)}</dd>` : ''}
      <dt>Write scope</dt><dd class="mono" style="font-size:11.5px">${esc(n.scope)}</dd>
      ${n.status !== 'planned' ? `<dt>Thread</dt><dd class="mono" style="font-size:11.5px">${threadId(n)}</dd>` : ''}
    </dl>`);
  if (n.id === 'orch') h += worldSection();
  if (n.kind === 'mgr') h += rollupSection(n);
  h += whoSees(n);
  if (n.children.length && n.kind !== 'mgr') h += childrenSection(n);
  if (n.kind === 'mgr') h += childrenSection(n);
  h += actionsSection(n);
  h += sec('Recent events', `<div class="tl-list">${timelineFor(n).slice(0, 6).map(e => `<div class="tl-item"><span class="tm">${clockOf(e.t)}</span><span class="ev">${fmt(e.e)}</span></div>`).join('')}</div>`);
  return h;
}

function ghostOverview(n) {
  return `<div class="sec"><div class="banner info">${ic('globe')}<div><b>This thread isn’t part of the run.</b> The Observatory lists every BB thread so you can see the whole machine. Adopt it to put it under a manager or lead; Helm then tracks and notifies it like any other agent.</div></div></div>`
    + sec('Thread', `<dl class="kv"><dt>Project</dt><dd>${esc(n.project)}</dd><dt>Model</dt><dd>${modelChip(n.model)}</dd><dt>Doing</dt><dd>${esc(n.now)}</dd></dl>`)
    + sec('Actions', `<div class="actions"><button class="btn primary sm" data-act="adopt" data-id="${n.id}">${ic('plus', 'sm')} Adopt into run…</button><button class="btn sm" data-act="open-thread" data-id="${n.id}">${ic('open', 'sm')} Open thread in BB</button></div>`);
}

/* ───────── chat ───────── */
function msgHTML(m, n) {
  const time = `<span class="faint">${clockOf(m.t)}</span>`;
  if (m.k === 'tool') return `<div class="toolrow">${ic('tool')}<span class="trunc">${esc(m.text)}</span>${m.d ? `<span class="d">${esc(m.d)}</span>` : ''}</div>`;
  if (m.k === 'sys') return `<div class="sysnote ${m.human ? 'human' : ''}">${ic(m.human ? 'hand' : 'alert', 'sm')}<div class="grow">${fmt(m.text)} ${time}</div></div>`;
  if (m.k === 'user') return `<div class="msg user"><span class="av">${ic('user')}</span><div class="bub"><div class="who"><b>You</b>${time}${m.id ? `<span class="pill human mono">${m.id}</span>` : ''}</div><div class="txt">${fmt(m.text)}</div>${m.note ? `<div class="sysnote human" style="margin:8px 0 0">${ic('hand', 'sm')}<div>${fmt(m.note)}</div></div>` : ''}</div></div>`;
  return `<div class="msg"><span class="av">${ic(ROLE_ICON[n.role] || 'code')}</span><div class="bub"><div class="who"><b>${esc(n.kind === 'orch' ? 'Orchestrator' : n.label)}</b>${time}</div><div class="txt">${fmt(m.text)}</div></div></div>`;
}

function tabChat(n) {
  const msgs = chatFor(n);
  const chain = notifyChain(n);
  const seen = chain.length ? chain.map(c => esc(trailLabel(c.id))).join(' · ') : 'recorded in the world state';
  const ph = n.kind === 'orch' ? 'Ask the Orchestrator anything, or tell it what to change…' : n.status === 'planned' ? `Leave a note for ${n.label} — it’s added to the spawn brief` : `Message ${n.label.toLowerCase()}…`;
  return `<div class="chat" id="chatScroll">${msgs.map(m => msgHTML(m, n)).join('')}</div>
    <div class="composer">
      <textarea id="chatIn" placeholder="${esc(ph)}" aria-label="Message">${esc((S.chatDraft || {})[n.id] || '')}</textarea>
      <div class="cmp-foot"><div class="notifychips">${ic('hand', 'sm')}<span>Logged as a directive. Seen by <b style="color:var(--fg-2)">${seen}</b></span></div>
        <button class="btn primary sm" data-act="chat-send">${ic('send', 'sm')} Send</button></div>
    </div>`;
}

function orchAnswer(q) {
  const t = q.toLowerCase();
  if (/chang|touch|did i|today|directive/.test(t)) {
    const mine = S.ledger.filter(d => d.type !== 'approve' && d.type !== 'deny');
    return `You’ve made ${mine.length} changes this run. All of them are in my world state and acknowledged up the chain:\n\n` + mine.slice(0, 8).map(d => `• ${d.id} · ${clockOf(d.t)} — ${dirSummary(d)}`).join('\n') + (mine.length > 8 ? `\n…and ${mine.length - 8} more in the Ledger.` : '') + `\n\nStanding policies in force: ${S.policies.length}.`;
  }
  if (/block|stuck|risk|wrong|problem/.test(t)) {
    const open = S.needs.filter(n => !n.done);
    return `${open.length} things are waiting on you or blocked:\n\n` + open.map(n => `• ${n.title} (${trailLabel(n.node)})`).join('\n') + `\n\nNothing else is stalled. ${queuedCount()} agents are queued for capacity — that is the scheduler working, not a fault.`;
  }
  if (/cost|spend|budget|money|\$/.test(t)) {
    return `Spent so far: ${fmtMoney(totalSpend())}. Forecast to finish: ${fmtMoney(forecastTotal())} at today’s model choices (relative weights, not real prices in this prototype).\n\nBiggest levers: the UI slot (GPT-6.1 Sol at Extra High) and the Reviewer slot. Moving the Reviewer from High to Medium would trim roughly 6% of the forecast; I won’t do it without you.`;
  }
  if (/status|summary|progress|where/.test(t)) {
    const c = S.apps.reduce((m, a) => (m[a.stage] = (m[a.stage] || 0) + 1, m), {});
    return `${c.build || 0} building, ${(c.review || 0) + (c.slop || 0)} in gates, ${c.fix || 0} fixing, ${c.ready || 0} ready for you, ${c.done || 0} done, ${c.spec || 0} in spec, ${c.intake || 0} in intake. ${S.needs.filter(n => !n.done).length} items need you.`;
  }
  return 'I have the whole portfolio in front of me. Ask about changes, blockers, spend or status — or tell me what to change and I’ll route it to the right manager and lead.';
}
function isQuestion(t) { return /\?\s*$/.test(t) || /^(what|which|how|why|who|where|status|summary|show|list|tell me)\b/i.test(t.trim()); }

/* ───────── direct ───────── */
const DTYPES = [
  ['tell', 'Message', 'chat'], ['model', 'Model', 'cpu'], ['scope', 'Role / scope', 'doc'], ['priority', 'Priority', 'flag'],
  ['pause', 'Pause', 'pause'], ['stop', 'Stop', 'stop'], ['retry', 'Retry', 'retry'], ['waive', 'Waive finding', 'gate'],
];
function dtypeAllowed(n, id) {
  if (n.ghost) return false;
  const live = !['planned', 'done'].includes(n.status);
  if (id === 'pause') return live || n.status === 'paused';
  if (id === 'stop') return live && n.kind !== 'orch';
  if (id === 'retry') return ['failed', 'idle', 'paused'].includes(n.status);
  if (id === 'waive') return n.kind === 'gate';
  return true;
}
function draftType(n) { const d = S.draft; return d.type === 'pause' && n.status === 'paused' ? 'resume' : d.type; }

function cascadeCounts(n) {
  const below = descendants(n.id).filter(id => S.nodes[id]);
  const direct = n.children.filter(id => S.nodes[id]);
  const live = below.filter(id => S.nodes[id].status !== 'planned');
  return { direct: direct.length, below: below.length, live: live.length, cost: live.reduce((a, id) => a + BASE_TOK[S.nodes[id].role] * costRate(S.nodes[id].model) * 0.0075 * 0.15, 0) };
}

function tabDirect(n) {
  if (n.ghost) return '<div class="pad muted">Adopt this thread into the run to direct it.</div>';
  const d = S.draft; if (!dtypeAllowed(n, d.type)) d.type = 'tell';
  const sent = S.lastSent && S.lastSent.target === n.id ? sentBox(S.lastSent) : '';
  return `<div id="sentHost">${sent}</div>
    <section class="sec"><h4><span>What do you want to change?</span></h4>
      <div class="dtypes">${DTYPES.map(([id, label, icn]) => { const on = d.type === id; const ok = dtypeAllowed(n, id); const lab = id === 'pause' && n.status === 'paused' ? 'Resume' : label; return `<button class="dtype ${on ? 'on' : ''}" data-act="dtype" data-v="${id}" ${ok ? '' : 'disabled'} title="${ok ? '' : 'Not available for this agent right now'}">${ic(id === 'pause' && n.status === 'paused' ? 'play' : icn)}${lab}</button>`; }).join('')}</div>
    </section>
    <section class="sec" id="dFields">${dirFields(n)}</section>
    ${n.children.length || n.kind === 'orch' ? `<section class="sec"><h4><span>Who it applies to</span></h4><div class="cards" id="dCascade">${cascadeHTML(n)}</div></section>` : ''}
    <section class="sec"><h4><span>What each person sees</span><span class="r" id="dCount"></span></h4><div id="dPreview"></div>
      <label class="check" style="margin-top:12px"><input type="checkbox" data-act="dpolicy" ${d.policy ? 'checked' : ''}><span><b>Make it a standing policy</b><br><span class="hint-t">Inject it into every agent spawned under ${esc(trailLabel(n.id))} from now on.</span></span></label>
    </section>
    <div style="position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;margin-top:auto">
      <span class="hint-t grow" id="dHint"></span>
      <button class="btn primary" id="dSend" data-act="dsend">${ic('send', 'sm')} Send directive</button>
    </div>`;
}

function cascadeHTML(n) {
  const c = cascadeCounts(n), d = S.draft;
  const card = (id, title, desc) => `<button class="rcard ${d.cascade === id ? 'on' : ''}" data-act="dcascade" data-v="${id}"><span class="rd"></span><span><b>${title}</b><span class="d">${desc}</span></span></button>`;
  return card('self', 'Only this agent', 'Its chain above is told, nobody below changes.')
    + card('reports', `This agent + its ${plural(c.direct, 'direct report')}`, 'Each of them gets the same directive.')
    + card('subtree', `Everyone below · ${plural(c.live, 'live agent')}${c.below - c.live ? ` + ${c.below - c.live} planned` : ''}`, `Applies down the whole subtree (${c.below} nodes). Model changes take effect on each agent’s next turn; est. extra context cost ≈ ${fmtMoney(c.cost)}.`);
}

function dirFields(n) {
  const d = S.draft, t = draftType(n);
  const modeSeg = `<div class="field"><label class="lbl">Delivery</label><div class="seg"><button data-act="dmode" data-v="steer" class="${d.mode === 'steer' ? 'on' : ''}">Steer now</button><button data-act="dmode" data-v="queue" class="${d.mode === 'queue' ? 'on' : ''}">Queue for after this turn</button></div><span class="hint-t">${d.mode === 'steer' ? 'Interrupts the current turn so the change lands immediately.' : 'Waits for the agent to finish its current work first.'}</span></div>`;
  if (t === 'tell') return `<div class="col" style="gap:12px"><div class="field"><label class="lbl" for="dText">Message to ${esc(trailLabel(n.id))}</label><textarea class="textarea" id="dText" data-bind="text" placeholder="e.g. Use warmer colors in dark mode — no pure black.">${esc(d.text)}</textarea></div>${modeSeg}</div>`;
  if (t === 'model') {
    if (!d.model) d.model = clone(n.model);
    PICK.sel = d.model; PICK.host = '#dPicker'; PICK.onChange = () => { S.draft.model = clone(PICK.sel); renderDirPreview(n); };
    return `<div class="col" style="gap:12px"><div class="row" style="gap:8px;flex-wrap:wrap"><span class="lbl">Current</span>${modelChip(n.model)}<span class="faint">→</span><span class="lbl">New</span><span id="dNewChip">${modelChip(d.model)}</span></div><div id="dPicker">${modelPickerHTML()}</div>
      <div class="banner info">${ic('cpu')}<div>Takes effect on the agent’s <b>next turn</b>; no restart and nothing is lost. The change is stored as a per-agent override, so slot changes in Model Studio won’t overwrite it.</div></div></div>`;
  }
  if (t === 'scope') return `<div class="col" style="gap:12px"><div class="field"><label class="lbl" for="dText">New role, scope or acceptance criteria</label><textarea class="textarea" id="dText" data-bind="text" style="min-height:110px" placeholder="e.g. Also own accessibility: VoiceOver labels on every control; Dynamic Type up to XXL.">${esc(d.text)}</textarea><span class="hint-t">Saved as brief v${(n.briefV || 3) + 1}. The agent re-reads it at its next turn.</span></div>${modeSeg}</div>`;
  if (t === 'priority') return `<div class="col" style="gap:12px"><div class="field"><label class="lbl">Priority</label><div class="seg">${['high', 'normal', 'low'].map(p => `<button data-act="dprio" data-v="${p}" class="${d.priority === p ? 'on' : ''}">${p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</div><span class="hint-t">The scheduler serves higher priority first when capacity is tight.</span></div><div class="field"><label class="lbl" for="dText">Why (optional)</label><input class="input" id="dText" data-bind="text" value="${esc(d.text)}" placeholder="e.g. Launch date moved up"></div></div>`;
  if (t === 'pause') return `<div class="col" style="gap:12px"><div class="field"><label class="lbl" for="dText">Reason (optional)</label><input class="input" id="dText" data-bind="text" value="${esc(d.text)}" placeholder="e.g. Waiting on a licensing decision"></div><div class="banner info">${ic('pause')}<div>The agent finishes its current step, then waits. Its worktree and context are kept. Pausing a lead doesn’t pause its builders — use “Everyone below” for that.</div></div></div>`;
  if (t === 'resume') return `<div class="banner info">${ic('play')}<div>The agent picks up where it stopped, with a note that you released it.</div></div>`;
  if (t === 'stop') return `<div class="col" style="gap:12px"><div class="banner crit">${ic('alert')}<div><b>Stops the thread.</b> The worktree stays on disk. Stopping does not cascade — children keep running unless you choose “Everyone below”.</div></div><div class="field"><label class="lbl" for="dText">Reason (optional)</label><input class="input" id="dText" data-bind="text" value="${esc(d.text)}"></div></div>`;
  if (t === 'retry') return `<div class="banner info">${ic('retry')}<div>Re-queues the agent from its last commit. If the failure was a provider error, you can change its model first.</div></div>`;
  if (t === 'waive') return `<div class="col" style="gap:12px"><div class="field"><label class="lbl" for="dText">Finding and why it’s acceptable (required)</label><textarea class="textarea" id="dText" data-bind="text" placeholder="e.g. #3 — license header on the vendored file is acceptable.">${esc(d.text)}</textarea></div><div class="banner warn">${ic('gate')}<div>A waiver is recorded with your name and shown to the lead, the manager and the Orchestrator. Zero-tolerance findings (secrets, placeholders on shipped paths, invented dependencies) need a written reason.</div></div></div>`;
  return '';
}

function draftSpec(n) {
  const d = S.draft, t = draftType(n);
  const spec = { type: t, target: n.id, text: (d.text || '').trim(), cascade: n.children.length || n.kind === 'orch' ? d.cascade : 'self', mode: d.mode, policy: d.policy };
  if (t === 'model') { spec.model = clone(d.model || n.model); spec.from = clone(n.model); }
  if (t === 'priority') { spec.value = d.priority; spec.priority = d.priority; }
  return spec;
}
function draftValid(n) {
  const d = S.draft, t = draftType(n);
  if (t === 'tell' || t === 'scope' || t === 'waive') return !!(d.text || '').trim();
  if (t === 'model') return !!d.model && (d.model.m !== n.model.m || d.model.r !== n.model.r);
  if (t === 'priority') return d.priority !== n.prio;
  return true;
}
function previewDirective(n) {
  const s = draftSpec(n);
  const affected = resolveCascade(n.id, s.cascade);
  const d = { id: 'D-' + String(S.dseq + 1).padStart(4, '0'), t: Date.now(), cascade: s.cascade, affected, ...s };
  d.from = s.from || clone(n.model);
  d.recipients = buildRecipients(d);
  return d;
}
function renderDirPreview(n) {
  const host = $('#dPreview'); if (!host) return;
  const s = draftSpec(n), ok = draftValid(n);
  const d = previewDirective(n);
  const rows = [];
  const tgt = d.recipients.find(r => r.level === 'direct' && r.id === n.id) || d.recipients.find(r => r.level === 'direct');
  const body = ok ? null : '<span class="faint">Fill in the form above to see the exact notice.</span>';
  const mk = (r) => {
    const rn = S.nodes[r.id];
    const kind = r.level === 'direct' ? 'direct' : r.world ? 'world' : r.level;
    return `<div class="prow"><div class="pw"><b>${esc(trailLabel(r.id))}</b>${lvlChip(r.level, r.world)}</div><div class="pt">${body || fmt(noticeText(d, kind))}</div></div>`;
  };
  if (tgt && tgt.id !== '*') rows.push(mk(tgt));
  d.recipients.filter(r => r !== tgt && r.id !== '*' && r.level !== 'direct').forEach(r => rows.push(mk(r)));
  const grp = d.recipients.find(r => r.id === '*');
  const extra = d.affected.length - 1;
  host.innerHTML = `<div class="preview"><div class="ph"><span>Preview</span><span class="mono" style="letter-spacing:0;text-transform:none">${d.id}</span></div>${rows.join('')}${grp ? `<div class="prow"><div class="pw"><b>+ ${grp.group} more</b><span class="lvl rec">Target</span></div><div class="pt">${plural(extra, 'agent')} below get the same message${s.type === 'model' ? ' and switch model on their next turn' : ''}.</div></div>` : ''}</div>`;
  const cnt = $('#dCount'); if (cnt) cnt.textContent = plural(d.recipients.filter(r => r.id !== '*').length, 'recipient') + (extra > 0 ? ` · ${plural(extra, 'agent')} affected` : '');
  const btn = $('#dSend'); if (btn) btn.disabled = !ok;
  const hint = $('#dHint'); if (hint) hint.textContent = ok ? `Notifies ${d.recipients.filter(r => r.level !== 'direct').length} up the chain` : (s.type === 'model' ? 'Pick a different model or reasoning level' : s.type === 'priority' ? 'Pick a different priority' : 'Write something first');
  const nc = $('#dNewChip'); if (nc && S.draft.model) nc.innerHTML = modelChip(S.draft.model);
}

function sentBox(d) {
  const rows = d.recipients.map(r => {
    if (r.id === '*') return `<div class="row" style="justify-content:space-between;font-size:12px"><span>+ ${r.group} more agents</span>${rcHTML(r.state)}</div>`;
    return `<div class="row" style="justify-content:space-between;font-size:12px;gap:8px"><span class="trunc"><b>${esc(trailLabel(r.id))}</b> <span class="faint">${r.level === 'direct' ? 'target' : r.world && r.id === 'orch' ? 'world state' : r.level}</span></span>${rcHTML(r.state)}</div>`;
  }).join('');
  const done = d.recipients.every(r => ['ack', 'rec'].includes(r.state));
  return `<section class="sec"><div class="banner ${done ? 'info' : 'human'}" style="flex-direction:column;gap:8px"><div class="row" style="gap:8px;width:100%">${ic(done ? 'check' : 'hand')}<b>${d.id} ${done ? 'delivered and acknowledged' : 'on its way'}</b><span class="grow"></span><button class="btn sm ghost" data-act="open-ledger" data-id="${d.id}">Ledger ${ic('chev', 'sm')}</button></div><div class="col" style="gap:5px;width:100%;color:var(--fg-2)">${rows}</div></div></section>`;
}

/* ───────── comms, brief, reports, changes ───────── */
function tabComms(n) {
  const list = commsFor(n);
  const nm = id => id === 'you' ? 'You' : id === 'helm' ? 'Helm' : trailLabel(id);
  if (!list.length) return '<div class="pad muted">No messages yet.</div>';
  return `<div class="pad"><div class="hint-t" style="margin-bottom:6px">Everything this agent sent or received, including notices about your changes. Each notice carries a delivery receipt.</div>${list.map(c => {
    const d = c.id && S.ledger.find(x => x.id === c.id); const r = d && d.recipients.find(r => r.id === n.id);
    return `<div class="comm"><span class="tm">${clockOf(c.t)}</span><div class="grow"><div class="arrow"><b>${esc(nm(c.from))}</b>${ic('chev', 'sm')}<b>${esc(nm(c.to))}</b>${c.id ? `<span class="pill human mono">${c.id}</span>` : ''}${r ? rcHTML(r.state) : ''}</div><div class="body">${fmt(c.text)}</div></div></div>`;
  }).join('')}</div>`;
}

function tabBrief(n) {
  const b = briefFor(n);
  const li = a => a.length ? `<ul>${a.map(x => `<li>${fmt(x)}</li>`).join('')}</ul>` : '';
  return `<div class="pad"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="pill mono">brief v${n.briefV || 3}</span><button class="btn sm" data-act="edit-brief" data-id="${n.id}">${ic('doc', 'sm')} Edit role / scope</button></div>
    ${n.brief ? `<div class="banner human" style="margin-bottom:12px">${ic('hand')}<div><b>You edited this brief (v${n.briefV}).</b> ${fmt(n.brief)}</div></div>` : ''}
    <div class="brief"><h5>Objective</h5><p style="margin:0">${fmt(b.obj)}</p><h5>Deliverables</h5>${li(b.del)}<h5>Boundaries</h5>${li(b.bounds)}<h5>Inputs</h5>${li(b.inputs)}<h5>Acceptance</h5>${li(b.acc)}</div>
    <div class="hint-t" style="margin-top:14px">Briefs follow a fixed shape — objective, outputs, boundaries, inputs, acceptance — so no agent has to guess what “done” means.</div></div>`;
}

function tabReports(n) {
  const rs = reportsFor(n);
  if (!rs.length) return `<div class="pad"><div class="empty">${n.status === 'planned' ? 'Not spawned yet — no reports.' : 'No reports yet.'}</div></div>`;
  return `<div class="pad">${rs.map(r => `<article class="rep"><div class="rep-h"><b>#${r.n} · ${esc(r.title)}</b><span class="grow"></span><span class="faint">${clockOf(r.t)}</span></div><div class="rep-b"><div>${fmt(r.sum)}</div><div class="evi">${esc(r.ev)}</div><div class="muted"><b style="color:var(--fg-2)">Next:</b> ${fmt(r.next)}</div></div></article>`).join('')}<div class="hint-t">Reports are evidence, not proof: the lead (and the gates) re-check them against the code.</div></div>`;
}

function changeRole(d, n) {
  if (d.target === n.id) return ['You changed this agent', 'human'];
  if (d.affected.includes(n.id)) return ['Cascaded from ' + trailLabel(d.target), 'human'];
  const r = d.recipients.find(r => r.id === n.id);
  if (r) return [r.level === 'full' ? `Full notice — ${trailLabel(d.target)} was changed` : `Digest — ${trailLabel(d.target)} was changed`, 'acc'];
  return ['', ''];
}

/* ───────── overlays ───────── */
const PO = { el: null, anchor: null };
const MO = { fn: null, onClose: null };

function openPop(anchor, html, o = {}) {
  if (PO.el && PO.anchor === anchor && !o.force) { closePop(); return; }
  closePop();
  const el = document.createElement('div'); el.className = 'pop'; el.style.width = (o.w || 360) + 'px'; el.innerHTML = html;
  $('#popLayer').appendChild(el); PO.el = el; PO.anchor = anchor;
  const r = anchor.getBoundingClientRect(), w = o.w || 360, vh = window.innerHeight, vw = window.innerWidth;
  let left = o.align === 'right' ? r.right - w : r.left;
  left = clamp(left, 10, vw - w - 10);
  let top = r.bottom + 8;
  const h = el.offsetHeight;
  if (top + h > vh - 10) top = Math.max(10, r.top - h - 8);
  if (top + h > vh - 10) top = Math.max(10, vh - h - 10);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
function closePop() { $('#popLayer').innerHTML = ''; PO.el = null; PO.anchor = null; }

function openModal(html, o = {}) {

}

function toast(msg, o = {}) {

  const host = $('#toasts'); host.appendChild(t);

function addNeed(o) { S.needs.unshift(Object.assign({ id: 'n' + (S.needs.length + 1) + Date.now() % 1000, t: 0 }, o)); }

function needAct(id, act) {
  const n = S.needs.find(x => x.id === id); if (!n || n.done) return;
  const nd = S.nodes[n.node], a = nd && appOf(nd);
  const finish = (res, d) => { n.done = true; n.result = res + (d ? ` · ${d.id}` : ''); refreshAll(); if (d) propagateSoon(d); };
  if (act === 'approve') { const d = directive({ type: 'approve', target: n.node, text: 'ran `npm audit fix --force`' }); nd.status = 'running'; nd.now = 'Running npm audit fix --force, then re-running the tests'; finish('Approved by you', d); toast('Approved', { sub: 'Security continues; its lead and manager were told.' }); }
  else if (act === 'deny') { const d = directive({ type: 'deny', target: n.node, text: 'use targeted upgrades instead of --force' }); nd.status = 'running'; nd.now = 'Choosing targeted upgrades instead of --force'; finish('Denied by you', d); toast('Denied', { sub: 'Security was told to choose a safer path.' }); }
  else if (act === 'signoff') { confirmModal({ title: `Sign off ${a.name}?`, body: `Reviewer ✓ · Slop Hunter ✓ · deterministic checks ✓. ${a.name} is marked done and its squad’s threads are archived. The Orchestrator and the ${S.mgrById[a.mgr].name} manager are told.`, ok: 'Sign off', cls: 'ok', fn: () => { doSignoff(a); n.done = true; n.result = 'Signed off by you'; refreshAll(); } }); }
  else if (act === 'sendback') { reasonModal({ title: `Send ${a.name} back to Build`, ph: 'What should change?', ok: 'Send back', fn: txt => { doSendBack(a, txt); n.done = true; n.result = 'Sent back to Build by you'; refreshAll(); } }); }
  else if (act === 'retry') { const d = directive({ type: 'retry', target: n.node }); finish('Retry requested', d); toast('Retrying', { sub: 'Resumes from its last commit.' }); }
  else if (act === 'model') { const el = document.querySelector(`[data-act="need"][data-v="model"][data-id="${id}"]`); openModelPop(el, n.node); }
  else if (act === 'fix') { const d = directive({ type: 'tell', target: n.node, text: 'Remove the hard-coded key, load it from the environment config, and rotate it. Then re-run the slop scan.' }); nd.status = 'running'; nd.now = 'Removing the hard-coded key and moving it to environment config'; finish('Sent to the lead to fix', d); toast('Lead told to fix it', { sub: 'The slop scan re-runs before the gate is spawned.' }); }
  else if (act === 'waive') { reasonModal({ title: 'Waive this finding', ph: 'Why is this acceptable? (e.g. it is a public, rate-limited demo key)', ok: 'Waive', fn: txt => { const d = directive({ type: 'waive', target: n.node, text: txt }); nd.status = 'running'; nd.now = 'Continuing; waiver recorded'; finish('Waived with a recorded reason', d); } }); }
  else if (act === 'approveplan') { const d = directive({ type: 'plan', target: 'orch', text: 'wave 4: 22 agents' }); S.appById.mintjar.stage = 'spec'; S.nodes['mintjar.lead'].status = 'running'; S.nodes['mintjar.lead'].now = 'Starting: reading the app brief, drafting SPEC.md'; finish('Wave 4 approved', d); toast('Wave 4 approved', { sub: 'Mint Jar starts; queued builders get slots as they free up.' }); }
  else if (act === 'editplan') toast('Plan editor', { sub: 'In the real plugin this opens the staffing plan as an editable table.' });
  else if (act.startsWith('answer:')) { const ans = n.options[+act.split(':')[1]]; const d = directive({ type: 'answer', target: n.node, text: ans }); nd.status = 'running'; nd.now = `Using “${ans}” — drafting SPEC.md`; finish('Answered: ' + ans, d); toast('Answer sent', { sub: `${trailLabel(n.node)} continues. The manager and Orchestrator were told.` }); }
}

'use strict';

let SM = null;   /* studio state */
let WZ = null;   /* wizard state */

const slotDef = id => SLOT_DEFS.find(s => s.id === id);
const FAMILY_NOTE = { OpenAI: 'OpenAI', Anthropic: 'Anthropic', xAI: 'xAI', Cursor: 'Cursor', Mixed: 'Mixed' };

function famWarn(slots) {
  const fam = k => slots[k] ? mdl(slots[k]).family : null;
  const out = [];
  [['review', 'ui', 'Reviewer', 'UI builders'], ['review', 'code', 'Reviewer', 'Code builders'], ['slop', 'ui', 'Slop Hunter', 'UI builders'], ['slop', 'code', 'Slop Hunter', 'Code builders']].forEach(([g, b, gn, bn]) => {
    if (fam(g) && fam(g) === fam(b)) out.push(`${gn} and ${bn} are both ${fam(g)} models — they can share blind spots.`);
  });
  return out;
}

function slotCounts() {
  if (SM && SM.mode === 'wizard' && WZ) return WZ.counts;
  const c = {}; Object.values(S.nodes).forEach(n => { c[n.slot] = (c[n.slot] || 0) + 1; }); return c;
}
function forecastFor(slots) {
  const counts = slotCounts(); let cost = 0, tok = 0;
  SLOT_DEFS.forEach(sd => { const ref = slots[sd.id]; if (!ref) return; const c = counts[sd.id] || 0; const base = BASE_TOK[sd.role] || 300; cost += c * base * costRate(ref) * 0.0075; tok += c * base; });
  return { cost, tok };
}

      <div class="forecast">

/* ───────── wizard ───────── */
function briefFromSeed() {
  const lines = ['Build all of these in parallel. Every app gets its own repository, one lead developer, and the platforms listed. I want a review and an AI-slop check on each before I see it.', ''];
  MGR_SEED.forEach((m, i) => { lines.push('# ' + m.name); APP_SEED.filter(a => a.m === i).forEach(a => lines.push(`- ${a.name} — ${a.tag} · ${a.plat.map(p => ({ ios: 'iOS', and: 'Android', mac: 'macOS', win: 'Windows' }[p])).join(' ')}`)); lines.push(''); });
  return lines.join('\n').trim();
}

function parseBrief(text) {
  const groups = []; let cur = null; const apps = [];
  text.split('\n').forEach(line => {
    const h = line.match(/^\s*#{1,3}\s*(.+?)\s*$/);
    if (h) { cur = { name: h[1], apps: [] }; groups.push(cur); return; }
    const m = line.match(/^\s*[-*•]\s*(.+?)\s+[—–-]{1,2}\s+(.+)$/);
    if (!m) return;
    const name = m[1].trim(); const parts = m[2].split(/\s*[·|]\s*/);
    const tag = parts[0].trim(); const pl = (parts.slice(1).join(' ') + ' ' + (parts.length === 1 ? m[2] : '')).toLowerCase();
    const plat = []; if (/ios|iphone|ipad/.test(pl)) plat.push('ios'); if (/android/.test(pl)) plat.push('and'); if (/mac/.test(pl)) plat.push('mac'); if (/win/.test(pl)) plat.push('win');
    const app = { name, tag, plat: plat.length ? plat : ['ios', 'and'], dropped: false };
    apps.push(app); if (!cur) { cur = { name: 'Ungrouped', apps: [] }; groups.push(cur); } cur.apps.push(app);
  });
  return { apps, groups: groups.filter(g => g.apps.length) };
}

function planPortfolio(parsed, span, ospan) {
  const apps = parsed.apps.filter(a => !a.dropped); const n = apps.length;
  const out = { n, apps, managers: [], why: '', error: '' };
  if (!n) { out.why = 'No apps found yet. Add lines like “- Name — tagline · iOS Android”.'; return out; }
  if (n <= 4) { out.why = `${n} apps ≤ 4, so the Orchestrator leads the app leads directly — no manager layer.`; return out; }
  const gs = parsed.groups.map(g => ({ name: g.name, apps: g.apps.filter(a => !a.dropped) })).filter(g => g.apps.length);
  const semantic = gs.length > 1 && gs.every(g => g.apps.length <= span) && gs.length <= ospan;
  if (semantic) { out.managers = gs; out.why = `${n} apps > 4, so managers are needed. Your headings group them naturally, and every group fits within ${span} leads — kept as written.`; }
  else {
    const k = Math.ceil(n / span); const base = Math.floor(n / k); let rem = n % k; let i = 0;
    for (let g = 0; g < k; g++) { const sz = base + (rem-- > 0 ? 1 : 0); out.managers.push({ name: gs.length ? `Group ${g + 1}` : `Manager ${g + 1}`, apps: apps.slice(i, i + sz) }); i += sz; }
    out.why = `${n} apps > 4, so managers are needed. With at most ${span} leads each that is ${k} managers, balanced as ${out.managers.map(m => m.apps.length).join(' + ')}.`;
  }
  if (out.managers.length > ospan) out.error = `${out.managers.length} managers exceeds the Orchestrator’s span of ${ospan}. Raise the manager span (max 6) or split this into two runs.`;
  return out;
}

function wzStaffing(plan) {
  const apps = plan.apps; const m = plan.managers.length;
  const p = apps.reduce((a, x) => a + x.plat.length, 0);
  const counts = { orchestrator: 1, manager: m, lead: apps.length, ui: apps.length, code: apps.length, platform: p, security: apps.length, test: 0, review: apps.length, slop: apps.length, research: 0, docs: 0 };
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  return { counts, total, specialists: apps.length * 3 + p, gates: apps.length * 2, platforms: p };
}

}
/* re-render without losing scroll position or the caret in a text field */
function keepState(fn) {
  const snap = snapScroll(); const a = document.activeElement;
  const f = a && a.id && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  fn();
  restoreScroll(snap);
  if (f) {

}

function patchGraph() {
  if (S.view !== 'graph' || !G.L || !$('#stage .edges')) return;
  const mode = S.drill ? 'squad' : 'portfolio';
  Object.entries(G.L.rects).forEach(([id, r]) => {

    const html = nodeMarkup(id, r, mode);

    const t = document.createElement('template'); t.innerHTML = html.trim();
    const nel = t.content.firstElementChild; nel._sig = html;
    const hadFocus = document.activeElement === old;
    old.replaceWith(nel); if (hadFocus) nel.focus({ preventScroll: true });
  });
  G.L.edges.forEach(e => {
    const p = $(`#stage .edges path[data-e="${e.from}|${e.to}"]`); if (!p) return;

}

ACT['insp-open'] = () => { S.inspectorOpen = true; renderInspector(); };
ACT['insp-toggle'] = () => { S.inspectorOpen = !S.inspectorOpen; renderInspector(); };
ACT['insp-wide'] = () => { S.inspWide = !S.inspWide; renderInspector(); };
ACT.tab = el => { S.tab = el.dataset.v; renderInspector(); };

/* chat: questions to the Orchestrator are answered; everything else is a directive */
function orchQA(q) {
  const o = S.nodes.orch;
  o.msgs.push({ k: 'user', t: Date.now(), text: q }); onAgentMsg('orch');
  later(() => { o.msgs.push({ k: 'agent', t: Date.now(), text: orchAnswer(q) }); onAgentMsg('orch'); }, 650);
}
ACT.ask = el => { selectNode('orch', { tab: 'chat' }); orchQA(el.dataset.q); };
ACT['chat-send'] = () => {
  const n = S.nodes[S.sel]; const ta = $('#chatIn'); if (!n || !ta) return;
  const text = ta.value.trim(); if (!text) { ta.focus(); return; }
  (S.chatDraft = S.chatDraft || {})[n.id] = ''; ta.value = '';
  if (n.kind === 'orch' && isQuestion(text)) { orchQA(text); return; }
  const d = directive({ type: 'tell', target: n.id, text, cascade: 'self', mode: 'steer' });
  S.lastSent = d; refreshAll(); propagateSoon(d);
  const c = $('#chatIn'); if (c) c.focus();
};

/* direct tab */
const curNode = () => node(S.sel);
const redrawFields = () => { const n = curNode(); const f = $('#dFields'); if (f && n) { f.innerHTML = dirFields(n); renderDirPreview(n); } };
ACT.dtype = el => {
  const v = el.dataset.v, t = S.draft.type;
  const keep = (t === 'tell' && v === 'scope') || (t === 'scope' && v === 'tell');
  S.draft.type = v; if (!keep) S.draft.text = '';
  rerenderTab();
};
ACT.dcascade = el => { S.draft.cascade = el.dataset.v; const n = curNode(); $('#dCascade').innerHTML = cascadeHTML(n); renderDirPreview(n); };
ACT.dmode = el => { S.draft.mode = el.dataset.v; redrawFields(); };
ACT.dprio = el => { S.draft.priority = el.dataset.v; redrawFields(); };
ACT.dpolicy = el => { S.draft.policy = el.checked; renderDirPreview(curNode()); };
ACT.dsend = () => {
  const n = curNode(); if (!n || !draftValid(n)) return;
  const spec = draftSpec(n);
  const d = directive(spec);
  resetDraft();
  const titles = { tell: 'Message sent', model: 'Model changed', scope: 'Brief updated', priority: 'Priority changed', pause: 'Paused', resume: 'Resumed', stop: 'Stopped', retry: 'Retrying', waive: 'Finding waived' };
  afterDirective(d, `${titles[d.type] || 'Directive sent'} · ${d.id}`, toldLine(d));
};

/* model picker (shared) */
ACT['pm-model'] = el => {
  const m = MODEL_BY_ID[el.dataset.m]; const prev = PICK.sel.r;
  PICK.sel.m = m.id; PICK.sel.r = m.reasoning.includes(prev) ? prev : (m.reasoning.includes('high') ? 'high' : m.reasoning[0] || '');
  pickRefresh();
};
ACT['pm-reason'] = el => { PICK.sel.r = el.dataset.r; pickRefresh(); };
ACT['pm-old'] = () => { PICK.showOld = !PICK.showOld; pickRefresh(); };
ACT['pop-close'] = () => closePop();
ACT['mp-apply'] = () => {
  const n = S.nodes[MP.id]; if (!n) return;
  if (PICK.sel.m === n.model.m && PICK.sel.r === n.model.r) return;
  const model = clone(PICK.sel);
  const d = directive({ type: 'model', target: MP.id, model, cascade: MP.cascade });
  const need = S.needs.find(x => x.node === MP.id && !x.done && x.kind === 'failed');
  let extra = '';
  if (need) { const r = directive({ type: 'retry', target: MP.id }); need.done = true; need.result = `Retried on ${modelText(model)} · ${r.id}`; extra = ' It is retrying on the new model.'; }
  closePop();
  afterDirective(d, `Model changed to ${modelText(model)}`, 'Takes effect on its next turn.' + extra + ' ' + toldLine(d));
};

/* ───────── view switching, filters, board ───────── */
ACT.view = el => { closePop(); S.view = el.dataset.v; renderAll(); };
ACT.lens = el => { S.lens = el.dataset.v; renderBoard(); };
ACT.swim = el => { S.swim = el.checked; renderBoard(); };
ACT['task-app'] = el => { S.taskApp = el.value; renderBoard(); };
ACT['hide-done'] = el => { S.hideDone = el.checked; renderBoard(); };
ACT.more = el => { S.expanded[el.dataset.v] = true; keepState(renderBoard); };
ACT.lfilter = el => { S.ledgerFilter = el.dataset.v; renderLedger(); };
ACT.nfilter = el => { S.needFilter = el.dataset.v; renderNeeds(); };
ACT['open-ledger'] = (el, e, id) => {
  S.openLedger = id; S.view = 'ledger'; closePop(); renderAll();
  const row = document.querySelector(`#v-ledger [data-id="${id}"]`);
  if (row) row.scrollIntoView({ block: 'center' });
};
ACT['toggle-ledger'] = (el, e, id) => { S.openLedger = S.openLedger === id ? null : id; keepState(renderLedger); };
ACT.need = el => needAct(el.dataset.id, el.dataset.v);

/* ───────── top bar, overlays ───────── */
ACT['cap-pop'] = el => capPop(el);
ACT['run-pop'] = el => runPop(el);
ACT.studio = () => { closePop(); openStudio(); };
ACT['new-run'] = () => { closePop(); openWizard(); };
ACT['spawns-paused'] = el => { S.spawnsPaused = el.checked; renderTop(); toast(S.spawnsPaused ? 'New spawns paused' : 'Spawning resumed', { sub: S.spawnsPaused ? 'Running agents finish their turn; nothing new starts.' : 'Queued agents start as slots free up.' }); };
ACT.theme = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next); S.theme = next;
  try { localStorage.setItem('helm-proto-theme', next); } catch (_) { }
  renderTop();
};
ACT.live = () => {
  S.live = !S.live; renderTop();
  if (S.live) { startLive(); toast('Live simulation on', { sub: 'Agents talk, builders finish, apps move through the gates. Prototype only.' }); } else stopLive();
};
ACT.scrim = (el, e) => { if (e.target === el) closeModal(); };
ACT['modal-close'] = () => closeModal();
ACT['modal-ok'] = () => {
  const f = MO.fn; if (!f) return;
  if (!$('#reasonIn')) closeModal(true);   /* a reason dialog validates, then closes itself */
  f();
};

/* ───────── delegated events ───────── */
function bindGlobal() {
  document.addEventListener('click', e => {
    if (PO.el && !e.target.closest('.pop') && !(PO.anchor && PO.anchor.contains(e.target))) closePop();
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return;   /* handled on change */
    const fn = ACT[el.dataset.act];
    if (!fn) { console.warn('No handler for data-act="' + el.dataset.act + '"'); return; }
    fn(el, e, el.dataset.id);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.matches && el.matches('input[data-act],select[data-act]')) { const fn = ACT[el.dataset.act]; if (fn) fn(el, e, el.dataset.id); return; }
    if (el.id === 'mpCascade') MP.cascade = el.value;
    if (el.dataset && el.dataset.bind === 'wz-conc') wzRender(true);
  });
  document.addEventListener('input', e => {
    const el = e.target; const b = el.dataset && el.dataset.bind;
    if (b === 'text') { S.draft.text = el.value; const n = curNode(); if (n) renderDirPreview(n); }
    else if (b === 'sm-q') { SM.q = el.value; const l = $('#catList'); if (l) l.innerHTML = catList(); }
    else if (b === 'wz-brief') { WZ.brief = el.value; wzCompute(); const f = $('#wzFound'); if (f) f.textContent = plural(WZ.plan.n, 'app') + ' found'; wzFooter(); }
    else if (b === 'wz-conc') { WZ.conc = +el.value; const v = $('#wzConcV'); if (v) v.textContent = el.value; }
    else if (b === 'wz-budget') WZ.budget = +el.value;
    else if (el.id === 'capSlider') { S.cap = +el.value; const v = $('#capVal'); if (v) v.textContent = S.cap; renderTop(); }
    else if (el.id === 'reasonIn') { const ok = $('#reasonOk'); if (ok) ok.disabled = !el.value.trim(); }
    else if (el.id === 'chatIn') (S.chatDraft = S.chatDraft || {})[S.sel] = el.value;
  });
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (e.key === 'Escape') {
      if ($('#modalLayer').firstChild) closeModal();
      else if (PO.el) closePop();
      return;
    }
    if (t.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ACT['chat-send'](); return; }
    if (isTyping() || e.metaKey || e.ctrlKey || e.altKey || $('#modalLayer').firstChild) return;
    if (e.key === '/' && S.view === 'graph') { e.preventDefault(); const s = $('#gSearch'); if (s) s.focus(); }
    else if (e.key === 'f' && S.view === 'graph') fitView(true);
    else if (['1', '2', '3', '4'].includes(e.key)) { S.view = ['graph', 'board', 'ledger', 'needs'][+e.key - 1]; closePop(); renderAll(); }
  });
  window.addEventListener('resize', () => closePop());
}

/* ───────── live simulation (prototype only) ───────── */
const SIM = { n: 0, timer: null };
const rnd = n => Math.floor(Math.random() * n);
const pickOne = a => a[rnd(a.length)];
const pickMany = (a, k) => { const c = a.slice(), out = []; while (c.length && out.length < k) out.push(c.splice(rnd(c.length), 1)[0]); return out; };
const say = (n, text, k = 'agent') => n.msgs.push({ k, t: Date.now(), text });
const sinceLoad = () => -(Date.now() - NOWMS) / 60000;
function startLive() { if (!SIM.timer) SIM.timer = setInterval(simTick, 2600); }
function stopLive() { clearInterval(SIM.timer); SIM.timer = null; }

function openGate(a, id) {
  const g = S.nodes[id]; g.status = 'running'; g.started = 1; g.tokens = 30; g.turns = 1; g.cost = g.tokens * costRate(g.model) * 0.0075;
  g.now = pickLine(g.rk, a, g.id); say(g, `Spawned by ${nodeLabel(S.nodes[a.lead])} — judging the integrated branch, not a work in progress.`, 'sys');
}
function passGate(a, id) { const g = S.nodes[id]; g.status = 'done'; g.now = nowText(g, a, S.nodes); say(g, g.now); }

/* apps advance on evidence, one stage at a time */
function advanceApps(touched) {
  S.apps.forEach(a => {
    const lead = S.nodes[a.lead];
    if (['paused', 'needs', 'failed'].includes(lead.status) || ['intake', 'fix', 'ready', 'done'].includes(a.stage)) return;
    a._t = (a._t || 0) + 1;
    const move = (stage, pct, note) => {
      a.stage = stage; a.pct = Math.max(a.pct, pct); a._t = 0;
      const msg = `${a.name} → ${stageLabel(stage)} · ${note}`;
      [lead, S.nodes[a.mgr], S.nodes.orch].forEach(n => { say(n, msg, 'sys'); touched.add(n.id); });
    };
    if (a.stage === 'spec' && a._t >= 4) {
      move('build', 20, 'CONTRACT approved');
      a.specs.forEach(id => { const s = S.nodes[id]; if (s.status === 'planned') { s.status = 'queued'; s.now = nowText(s, a, S.nodes); touched.add(id); } });
      lead.status = 'waiting'; lead.now = nowText(lead, a, S.nodes);
    } else if (a.stage === 'build') {
      if (Math.random() < .6) a.pct = Math.min(75, a.pct + 1);
      if (a.specs.every(id => S.nodes[id].status === 'done')) { move('integrate', 78, 'all builders done'); lead.status = 'running'; lead.now = 'Merging the builders’ branches in dependency order'; }
    } else if (a.stage === 'integrate' && a._t >= 3) {
      move('review', 86, 'integration checks green'); lead.status = 'waiting'; openGate(a, a.review); lead.now = nowText(lead, a, S.nodes);
    } else if (a.stage === 'review' && a._t >= 3) {
      passGate(a, a.review); move('slop', 92, 'Reviewer passed'); openGate(a, a.slop); lead.now = nowText(lead, a, S.nodes);
    } else if (a.stage === 'slop' && a._t >= 3) {
      passGate(a, a.slop); move('ready', 100, 'Slop Hunter passed'); lead.status = 'needs'; lead.now = nowText(lead, a, S.nodes);
      addNeed({ kind: 'signoff', node: a.lead, title: `${a.name} is ready for your sign-off`, body: 'The Reviewer passed, the Slop Hunter passed and the deterministic checks are green.', evidence: 'review    PASS\nslop      PASS  0 findings\nchecks    build ✓  lint ✓  tests ✓', t: sinceLoad() });
      toast(`${a.name} is ready for you`, { sub: 'Open Needs you to sign it off.' });
    }
  });
}

function simApproval() {
  const n = pickOne(Object.values(S.nodes).filter(x => x.rk === 'security' && x.status === 'running' && !S.needs.some(q => !q.done && q.node === x.id)));
  if (!n) return;
  const a = appOf(n);
  n.status = 'needs'; n.now = 'Asks to run `npm audit fix --force`';
  addNeed({ kind: 'approval', node: n.id, title: 'Approve running `npm audit fix --force`?', body: `Security wants to upgrade packages across major versions in ${a.name}. It edits package.json and the lockfile in its own worktree.`, evidence: '$ npm audit fix --force\n→ would bump 4 packages across major versions', t: sinceLoad() });
  toast(`${a.name} · Security needs you`, { kind: 'warn', sub: 'A new approval is waiting in Needs you.' });
}
function simFailure() {
  const n = pickOne(Object.values(S.nodes).filter(x => x.rk.startsWith('p.') && x.status === 'running' && !S.needs.some(q => !q.done && q.node === x.id)));
  if (!n) return;
  n.status = 'failed'; n.now = nowText(n, appOf(n), S.nodes);
  addNeed({ kind: 'failed', node: n.id, title: `${appOf(n).name} · ${n.label} failed`, body: 'The provider returned a rate-limit error after three retries. The worktree is intact and the agent can resume from its last commit.', evidence: 'provider-retry  429  attempt 3/3', t: sinceLoad() });
  toast(`${appOf(n).name} · ${n.label} failed`, { kind: 'warn', sub: 'Retry it from Needs you, or on another model.' });
}

function simTick() {
  if (document.hidden || S.drag) return;
  SIM.n++;
  const all = Object.values(S.nodes);
  const touched = new Set();
  const workers = all.filter(n => n.status === 'running' && n.kind !== 'orch' && n.kind !== 'mgr');

  /* agents move through their work */
  pickMany(workers, 4).forEach(n => {
    n.now = pickLine(n.rk, appOf(n), n.id, 1 + (SIM.n + hash(n.id)) % 9);
    n.tokens += 12 + rnd(38); n.turns += 1; n.cost = n.tokens * costRate(n.model) * 0.0075;
    say(n, n.now); touched.add(n.id);
  });

  /* a builder finishes */
  if (SIM.n % 3 === 0) {
    const c = pickOne(workers.filter(n => n.kind === 'spec'));
    if (c) {
      c.status = 'done'; c.now = nowText(c, appOf(c), S.nodes); touched.add(c.id);
      say(c, 'Finished. Final report filed; the branch is ready for the lead to merge.');
      const l = S.nodes[c.parent]; say(l, `${c.label} reported done on ${appOf(c).name}.`); touched.add(l.id);
    }
  }

  /* queued builders start when a slot frees up */
  if (!S.spawnsPaused) {
    let free = Math.min(2, S.cap - runningCount());
    all.filter(n => n.status === 'queued' && (n.kind === 'spec' || n.kind === 'gate'))
      .sort((a, b) => ((b.prio === 'high') - (a.prio === 'high')) || ((a.prio === 'low') - (b.prio === 'low')))
      .forEach(n => {
        if (free <= 0) return; free--;
        n.status = 'running'; n.started = 1; n.tokens = n.tokens || 24; n.now = pickLine(n.rk, appOf(n), n.id);
        say(n, 'A slot freed up — starting now.', 'sys'); touched.add(n.id);
      });
  }

  advanceApps(touched);
  if (SIM.n === 6) simApproval();
  if (SIM.n === 12) simFailure();

  /* repaint only what moved */
  patchGraph(); renderTop();
  if (S.view === 'board') keepState(renderBoard);
  if (S.view === 'needs') keepState(renderNeeds);
  const sel = S.nodes[S.sel];
  if (sel && touched.has(sel.id)) {
    if (S.tab === 'chat') onAgentMsg(sel.id);
    else if (S.tab === 'overview' && !isTyping()) keepState(renderInspector);
  }
}

/* ───────── init ───────── */
(function init() {
  try { const t = localStorage.getItem('helm-proto-theme'); if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); S.theme = t; } } catch (_) { }
  S.sel = 'orch'; S.tab = 'overview';
  if (window.innerWidth <= 1100) S.inspectorOpen = false;   /* overlay layout: start with the canvas clear */
  bindGlobal(); initGraph(); bindBoard();
  renderAll();
  requestAnimationFrame(() => fitView(false));
})();

</script>
