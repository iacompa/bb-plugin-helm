<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Helm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ───────────── tokens ───────────── */
:root{
  --font-ui:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Instrument Sans',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#edf1f3; --bg-dot:#cfd9de;
  --surface:#ffffff; --surface-2:#f4f7f8; --surface-3:#e8eef1;
  --line:#dae2e7; --line-strong:#bfcbd3;
  --fg:#10202a; --fg-2:#34495a; --fg-3:#5c7180; --fg-4:#8b9ba6;
  --accent:#2a58e0; --accent-ink:#ffffff; --accent-soft:#e3eafd; --accent-line:#aebff2;
  --running:#0b8b98; --running-soft:#d9f2f4; --running-ink:#075f69;
  --wait:#5f80a8; --wait-soft:#e2ebf4; --wait-ink:#3a5878;
  --ok:#1a8c58; --ok-soft:#d9f1e5; --ok-ink:#106239;
  --warn:#c07800; --warn-soft:#fcefd2; --warn-ink:#744700;
  --crit:#d03a35; --crit-soft:#fbe3e1; --crit-ink:#962420;
  --human:#d4336b; --human-soft:#fbe1ea; --human-ink:#9c1f4c;
  --idle:#8798a3; --idle-soft:#e5ebee;
  --p-codex:#7a5af0; --p-claude:#d8733a; --p-cursor:#3d76b3; --p-grok:#6a757e;
  --m0:#5578e6; --m1:#9360d6; --m2:#c4862a; --m3:#2d9d82; --m4:#7f9a2e;
  --shadow-1:0 1px 2px rgba(16,32,42,.07),0 0 0 .5px rgba(16,32,42,.03);
  --shadow-2:0 8px 22px rgba(16,32,42,.13),0 2px 6px rgba(16,32,42,.07);
  --shadow-pop:0 18px 48px rgba(16,32,42,.26),0 3px 10px rgba(16,32,42,.12);
  --scrim:rgba(10,20,28,.42);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1116; --bg-dot:#18232b;
--surface:#121a20; --surface-2:#172129; --surface-3:#1e2b34;
--line:#233440; --line-strong:#34495a;
--fg:#e6edf1; --fg-2:#bccad3; --fg-3:#8c9eaa; --fg-4:#62747f;
--accent:#7794ff; --accent-ink:#09101f; --accent-soft:#17234a; --accent-line:#2f4390;
--running:#2cc5d3; --running-soft:#0d2e33; --running-ink:#7fe3ec;
--ok:#3ccb8a; --ok-soft:#0f2f20; --ok-ink:#86e6b8;
--warn:#e8a63b; --warn-soft:#33260b; --warn-ink:#f4cd85;
--crit:#f26d67; --crit-soft:#3b1816; --crit-ink:#f9a8a4;
--human:#f06b9b; --human-soft:#3b1626; --human-ink:#f8a5c3;
--idle:#7a8b95; --idle-soft:#1c2830;
--p-codex:#9b86ff; --p-claude:#f08a52; --p-cursor:#5b97d6; --p-grok:#8b98a2;
--m0:#7d98f0; --m1:#b08be8; --m2:#dba24a; --m3:#46bda0; --m4:#a3bd49;
--shadow-1:0 1px 2px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.03);
--shadow-2:0 10px 26px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
--shadow-pop:0 22px 56px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.4);
--scrim:rgba(2,6,10,.62);
color-scheme:dark;

    --wait:#7ea3cf; --wait-soft:#16273a; --wait-ink:#a9c6e8;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1116; --bg-dot:#18232b;
--surface:#121a20; --surface-2:#172129; --surface-3:#1e2b34;
--line:#233440; --line-strong:#34495a;
--fg:#e6edf1; --fg-2:#bccad3; --fg-3:#8c9eaa; --fg-4:#62747f;
--accent:#7794ff; --accent-ink:#09101f; --accent-soft:#17234a; --accent-line:#2f4390;
--running:#2cc5d3; --running-soft:#0d2e33; --running-ink:#7fe3ec;
--ok:#3ccb8a; --ok-soft:#0f2f20; --ok-ink:#86e6b8;
--warn:#e8a63b; --warn-soft:#33260b; --warn-ink:#f4cd85;
--crit:#f26d67; --crit-soft:#3b1816; --crit-ink:#f9a8a4;
--human:#f06b9b; --human-soft:#3b1626; --human-ink:#f8a5c3;
--idle:#7a8b95; --idle-soft:#1c2830;
--p-codex:#9b86ff; --p-claude:#f08a52; --p-cursor:#5b97d6; --p-grok:#8b98a2;
--m0:#7d98f0; --m1:#b08be8; --m2:#dba24a; --m3:#46bda0; --m4:#a3bd49;
--shadow-1:0 1px 2px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.03);
--shadow-2:0 10px 26px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
--shadow-pop:0 22px 56px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.4);
--scrim:rgba(2,6,10,.62);
color-scheme:dark;

  --wait:#7ea3cf; --wait-soft:#16273a; --wait-ink:#a9c6e8;
}

/* ───────────── base ───────────── */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.sm{width:13px;height:13px}
svg.ic.lg{width:20px;height:20px}
.mono{font-family:var(--font-mono);font-feature-settings:"zero" 1}
.muted{color:var(--fg-3)}
.faint{color:var(--fg-4)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft);color:var(--fg)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px;border:2px solid transparent;background-clip:content-box}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ───────────── shell ───────────── */
#app{display:grid;grid-template-rows:52px minmax(0,1fr);height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:6px;padding:0 12px 0 14px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0;position:relative;z-index:30;overflow-x:clip}
.brand{display:flex;align-items:center;gap:9px;font:700 19px/1 var(--font-display);letter-spacing:-.02em;margin-right:6px}
.brand .logo{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.brand .logo .ic{width:18px;height:18px;stroke-width:1.9}
.sample-tag{font:600 9.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn-ink);white-space:nowrap}
.runsw{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);max-width:340px;flex:0 0 auto;white-space:nowrap}
.runsw .rs-sub{overflow:hidden;text-overflow:ellipsis}
.runsw:hover{border-color:var(--line-strong);background:var(--surface-3)}
.runsw b{font-weight:650}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--running);box-shadow:0 0 0 0 var(--running);animation:beat 2s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--running) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tabs{display:flex;align-items:stretch;height:52px;margin-left:6px}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:0 12px;color:var(--fg-3);font-weight:550;white-space:nowrap;flex:0 0 auto}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;font:600 10.5px/1 var(--font-mono);background:var(--surface-3);color:var(--fg-2)}
.count.warn{background:var(--warn);color:#fff}
.count.hot{background:var(--human);color:#fff}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--fg-2);font-size:12px;white-space:nowrap}
button.chip:hover{border-color:var(--line-strong);background:var(--surface-3)}
.chip b{font:600 12px var(--font-mono);color:var(--fg)}
.chip .sep{width:1px;height:12px;background:var(--line-strong)}
.chip.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:550;white-space:nowrap;color:var(--fg)}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--fg-4)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.danger:hover:not(:disabled){background:var(--crit-soft)}
.btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface-3)}
.iconbtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:8px;color:var(--fg-3)}
.iconbtn:hover{background:var(--surface-3);color:var(--fg)}
.iconbtn.sm{width:24px;height:24px;border-radius:6px}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0;min-width:0}
.stagewrap{position:relative;min-width:0;min-height:0;background:var(--bg)}
.view{display:none;position:absolute;inset:0;min-width:0}
.view.on{display:block}
.inspector{width:var(--insp-w,460px);border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;z-index:12}
.inspector.wide{--insp-w:700px}

/* ───────────── pills, chips, small parts ───────────── */
.mchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:21px;padding:0 7px 0 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font:500 11px/1 var(--font-mono);color:var(--fg-2);white-space:nowrap;min-width:0}
.mchip .mn{overflow:hidden;text-overflow:ellipsis}
.mchip em{font-style:normal;color:var(--fg-3);padding-left:6px;border-left:1px solid var(--line-strong)}
button.mchip:hover{border-color:var(--fg-4);background:var(--surface)}
.mchip.big{height:28px;padding:0 10px 0 8px;font-size:12px;border-radius:8px}
.mchip.planned{border-style:dashed;background:transparent}
.pdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--idle)}
.stpill{display:inline-flex;align-items:center;gap:5px;font:600 9.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--st-ink,var(--fg-3));white-space:nowrap}
.stpill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--st,var(--idle))}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font:600 10.5px/1 var(--font-ui);background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.pill.human{background:var(--human-soft);color:var(--human-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.run{background:var(--running-soft);color:var(--running-ink)}
.pill.crit{background:var(--crit-soft);color:var(--crit-ink)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.mono{font-family:var(--font-mono);font-weight:600;letter-spacing:.02em}
.tagnew{font:700 9px/1 var(--font-mono);letter-spacing:.07em;padding:3px 5px;border-radius:4px;background:var(--accent);color:var(--accent-ink)}
.kbd{font:500 10px/1 var(--font-mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:2px 4px;color:var(--fg-3);background:var(--surface)}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:9px;background:var(--surface-3)}
.seg button{height:26px;padding:0 10px;border-radius:7px;color:var(--fg-3);font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.glass{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-1)}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--st,var(--idle));flex:none}
.dot.s-queued{background:transparent;box-shadow:inset 0 0 0 1.5px var(--idle)}
.dot.s-planned{background:transparent;border:1.5px dashed var(--line-strong)}
.dot.s-paused{background:repeating-linear-gradient(45deg,var(--idle) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--idle)}
.dot.touched{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--human)}
.meter{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter.run>i{background:var(--running)}
.meter.warn>i{background:var(--warn)}
.stackbar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--surface-3);gap:1px}
.stackbar i{display:block;height:100%}

/* status vars */
.s-running{--st:var(--running);--st-ink:var(--running-ink);--st-soft:var(--running-soft)}
.s-waiting{--st:var(--wait);--st-ink:var(--wait-ink);--st-soft:var(--wait-soft)}
.s-queued{--st:var(--idle);--st-ink:var(--fg-3);--st-soft:var(--idle-soft)}
.s-needs{--st:var(--warn);--st-ink:var(--warn-ink);--st-soft:var(--warn-soft)}
.s-failed{--st:var(--crit);--st-ink:var(--crit-ink);--st-soft:var(--crit-soft)}
.s-done{--st:var(--ok);--st-ink:var(--ok-ink);--st-soft:var(--ok-soft)}
.s-paused{--st:var(--idle);--st-ink:var(--fg-3);--st-soft:var(--idle-soft)}
.s-planned{--st:var(--line-strong);--st-ink:var(--fg-4);--st-soft:transparent}
.s-idle{--st:var(--idle);--st-ink:var(--fg-3);--st-soft:var(--idle-soft)}

/* ───────────── graph ───────────── */
.canvas{position:absolute;inset:0;overflow:hidden;container-type:inline-size;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1px,transparent 1.2px);background-size:22px 22px;touch-action:none}
.canvas.panning{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage.anim{transition:transform .38s cubic-bezier(.2,.7,.2,1)}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:var(--line-strong);stroke-width:1.6}
.edges path.run{stroke:var(--running);stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
.edges path.plan{stroke-dasharray:3 5;opacity:.6}
.edges path.gate{stroke-dasharray:2 4}
.edges path.touch{stroke:var(--human)}
.edges path.chain{stroke:var(--accent-line)}
.edges path.hot{stroke:var(--human);stroke-width:2.4;opacity:1}
@keyframes flow{to{stroke-dashoffset:-11}}
.cluster{position:absolute;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 46%,transparent)}
.cluster .cl-label{position:absolute;left:14px;top:-9px;padding:0 7px;font:600 10px/16px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);background:var(--bg);border-radius:6px}
.zone-label{position:absolute;font:600 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-4);white-space:nowrap}
.node{position:absolute;display:flex;flex-direction:column;gap:5px;padding:9px 11px 8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-1);cursor:pointer;transition:box-shadow .15s,border-color .15s,opacity .2s,background .2s;--st:var(--idle);user-select:none;-webkit-user-select:none;text-align:left}
.node::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--st)}
.node:hover{border-color:var(--line-strong);box-shadow:var(--shadow-2);z-index:4}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-2);z-index:5}
.node.dim{opacity:.26}
.node.hit{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow-2)}
.node.flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--running) 20%,var(--surface))}100%{background:var(--surface)}}
.node.s-running::after{content:"";position:absolute;inset:-1px;border-radius:12px;pointer-events:none;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--running) 38%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.node.s-needs{border-color:var(--warn);background:color-mix(in srgb,var(--warn-soft) 55%,var(--surface))}
.node.s-needs::after{content:"";position:absolute;inset:-1px;border-radius:12px;pointer-events:none;animation:ringw 1.8s ease-out infinite}
@keyframes ringw{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 50%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.node.s-failed{border-color:var(--crit)}
.node.s-planned{background:transparent;border-style:dashed;border-color:var(--line-strong);box-shadow:none}
.node.s-planned::before{background:transparent}
.node.s-planned .n-title b{color:var(--fg-3)}
.node.s-paused{background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--idle) 12%,transparent) 7px 14px),var(--surface)}
.node.s-done .now{color:var(--fg-4)}
.node.ghostn{background:transparent;border-style:dashed;box-shadow:none;opacity:.85}
.node.ghostn::before{background:var(--idle)}
.n-head{display:flex;align-items:center;gap:8px;min-width:0}
.tile{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--fg-2);flex:none}
.tile .ic{width:14px;height:14px}
.tile.tier{background:var(--accent-soft);color:var(--accent)}
.tile.gate{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg-3);color:var(--fg)}
.tile.lg{width:34px;height:34px;border-radius:10px}
.tile.lg .ic{width:19px;height:19px}
.n-title{display:flex;flex-direction:column;min-width:0;flex:1}
.n-title b{font-weight:650;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-sub{font-size:11px;color:var(--fg-3);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now{font-size:11.5px;line-height:1.35;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.touchb{position:absolute;top:-9px;right:10px;display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px 0 5px;border-radius:9px;background:var(--human);color:#fff;font:600 10px/1 var(--font-ui);box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:2}
.touchb .ic{width:11px;height:11px;stroke-width:2}
.needb{position:absolute;top:-9px;left:12px;display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:9px;background:var(--warn);color:#fff;font:700 10px/1 var(--font-ui);z-index:2}
.node.app{padding:9px 11px 8px 14px;gap:6px;justify-content:center}
.app .a-top{display:flex;align-items:center;gap:8px;min-width:0}
.app .a-name{font:650 14.5px/1.1 var(--font-display);letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.app .a-bot{display:flex;align-items:center;gap:8px;justify-content:space-between}
.app .a-plats{font:500 9.5px/1 var(--font-mono);color:var(--fg-3);letter-spacing:.02em;white-space:nowrap}
.stage-pill{font:600 9px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.07em;padding:3px 5px;border-radius:4px;background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.stage-pill.run{background:var(--running-soft);color:var(--running-ink)}
.stage-pill.gate{background:var(--accent-soft);color:var(--accent)}
.stage-pill.ready{background:var(--ok-soft);color:var(--ok-ink)}
.stage-pill.done{background:var(--ok);color:#fff}
.stage-pill.fix{background:var(--warn-soft);color:var(--warn-ink)}
.mcolor{width:3px;align-self:stretch;border-radius:2px;flex:none}
.canvas[data-lod="low"] .now,.canvas[data-lod="low"] .node .mchip{display:none}
.canvas[data-lod="low"] .node.app .a-name{font-size:18px}
.canvas[data-lod="low"] .n-title b{font-size:16px}
.canvas[data-lod="low"] .n-sub{font-size:13px}
.abar{position:absolute;z-index:9;display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow-pop);transform-origin:50% 100%;white-space:nowrap}
.abar.below{transform-origin:50% 0}
.abar.below::after{bottom:auto;top:-4px}
.abar::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--fg);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.abar button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;color:var(--bg);font-weight:550;font-size:12px}
.abar button:hover{background:color-mix(in srgb,var(--bg) 18%,transparent)}
.abar .sepv{width:1px;background:color-mix(in srgb,var(--bg) 25%,transparent);margin:4px 2px}
.ctl{position:absolute;z-index:6}
.ctl.tl{left:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ctl.tr{right:12px;top:12px;display:flex;gap:8px;align-items:flex-start}
.ctl.bl{left:12px;bottom:12px}
.ctl.br{right:12px;bottom:12px}
.crumbs{display:flex;align-items:center;gap:1px;padding:3px}
.crumb{padding:4px 8px;border-radius:7px;color:var(--fg-3);font-weight:550;display:inline-flex;align-items:center;gap:6px}
.crumb:hover{background:var(--surface-3);color:var(--fg)}
.crumb.cur{color:var(--fg);font-weight:650;cursor:default}
.crumb.cur:hover{background:none}
.crumbs .ic.sep{width:12px;height:12px;color:var(--fg-4)}
.search{display:flex;align-items:center;gap:7px;height:32px;padding:0 9px;width:240px;color:var(--fg-3)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--fg)}
.search input::placeholder{color:var(--fg-4)}
.legend{padding:7px 11px;display:flex;gap:11px;flex-wrap:wrap;max-width:620px;font-size:11px;color:var(--fg-3)}
.lgi{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.zoomctl{display:flex;align-items:center;padding:3px;gap:2px}
.zoomctl .zl{min-width:44px;text-align:center;font:500 11px var(--font-mono);color:var(--fg-2)}
.hint{font-size:11px;color:var(--fg-4);padding:6px 10px;border-radius:8px}
.ripple{position:absolute;border-radius:14px;border:2px solid var(--human);pointer-events:none;animation:ripple 1.1s ease-out forwards;z-index:7}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.28,1.5)}}
.particle{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--human);box-shadow:0 0 0 3px color-mix(in srgb,var(--human) 28%,transparent),0 0 14px var(--human);z-index:8;pointer-events:none}
.notified{position:absolute;z-index:8;pointer-events:none;display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:10px;background:var(--human);color:#fff;font:600 10px/1 var(--font-ui);box-shadow:0 2px 6px rgba(0,0,0,.28);animation:notif 2.6s ease-out forwards;white-space:nowrap}
@keyframes notif{0%{opacity:0;transform:translateY(6px) scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* ───────────── inspector ───────────── */
.insp-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.insp-title{display:flex;align-items:flex-start;gap:11px}
.insp-title h2{margin:0;font:650 19px/1.15 var(--font-display);letter-spacing:-.015em}
.insp-title .sub{color:var(--fg-3);font-size:12px;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.trail{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:11.5px}
.trail button{padding:2px 7px;border-radius:6px;color:var(--fg-3);background:var(--surface-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}
.trail button:hover{color:var(--fg);border-color:var(--line-strong)}
.trail .ic.sep{width:11px;height:11px;color:var(--fg-4)}
.trail .you{padding:2px 7px;border-radius:6px;background:var(--human-soft);color:var(--human-ink);display:inline-flex;align-items:center;gap:5px;font-weight:600}
.insp-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;flex:none}
.itab{position:relative;padding:10px 7px;color:var(--fg-3);font-weight:550;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.itab:hover{color:var(--fg)}
.itab.on{color:var(--fg)}
.itab.on::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.itab .count{height:16px;min-width:16px;font-size:9.5px}
.insp-body{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.pad{padding:14px 16px}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 9px;font:600 10.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:8px;justify-content:space-between}
.sec h4 .r{text-transform:none;letter-spacing:0;font-family:var(--font-ui);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.stat b{display:block;font:600 15px/1.1 var(--font-mono);letter-spacing:-.02em}
.stat span{font-size:10.5px;color:var(--fg-3)}
.talk{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--fg-2)}
.topics{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.topic{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--fg-2)}
.chain{display:flex;flex-direction:column;gap:0;position:relative}
.chain .lk{display:flex;align-items:center;gap:10px;padding:6px 0;position:relative;font-size:12.5px}
.chain .lk:not(:last-child)::after{content:"";position:absolute;left:11.5px;top:30px;bottom:-6px;width:1px;background:var(--line-strong)}
.chain .lk .who{flex:1;min-width:0}
.lvl{font:600 9.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.lvl.full{background:var(--human-soft);color:var(--human-ink)}
.lvl.dig{background:var(--accent-soft);color:var(--accent)}
.lvl.rec{background:var(--surface-3)}
.kidlist{display:flex;flex-direction:column;gap:2px}
.kidrow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;text-align:left;width:100%}
.kidrow:hover{background:var(--surface-2)}
.kidrow .n{flex:1;min-width:0;font-weight:550}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.tl-list{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:10px;padding:5px 0;font-size:12px;position:relative}
.tl-item .tm{width:42px;color:var(--fg-4);font:500 10.5px/1.6 var(--font-mono);flex:none}
.tl-item .ev{flex:1;min-width:0;color:var(--fg-2)}
.tl-item .ev b{font-weight:600;color:var(--fg)}
.world{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wcell{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.wcell b{display:block;font:650 17px/1.1 var(--font-display);letter-spacing:-.01em}
.wcell span{font-size:11px;color:var(--fg-3)}
.askrow{display:flex;flex-wrap:wrap;gap:6px}
.askrow button{padding:5px 10px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:550}
.askrow button:hover{background:color-mix(in srgb,var(--accent-soft) 70%,var(--accent))}
.banner{padding:10px 12px;border-radius:10px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}
.banner.info{background:var(--accent-soft);color:var(--fg-2)}
.banner.crit{background:var(--crit-soft);color:var(--crit-ink)}
.banner.human{background:var(--human-soft);color:var(--human-ink)}
.banner .ic{margin-top:1px}

/* chat */
.chat{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .av{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);flex:none;color:var(--fg-2)}
.msg .av .ic{width:14px;height:14px}
.msg.user .av{background:var(--human);color:#fff}
.msg .bub{min-width:0;flex:1}
.msg .who{font-size:11.5px;color:var(--fg-3);margin-bottom:2px;display:flex;gap:8px;align-items:center}
.msg .who b{color:var(--fg);font-weight:650}
.msg .txt{font-size:13px;line-height:1.5;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.msg .txt code,.sysnote code,.preview code{font:500 11.5px var(--font-mono);background:var(--surface-3);padding:1px 5px;border-radius:4px}
.msg.user .txt{background:var(--human-soft);border:1px solid color-mix(in srgb,var(--human) 25%,transparent);padding:8px 11px;border-radius:4px 12px 12px 12px;color:var(--fg)}
.toolrow{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font:500 11.5px var(--font-mono);color:var(--fg-2);margin-left:36px}
.toolrow .ic{width:13px;height:13px;color:var(--fg-3)}
.toolrow .d{margin-left:auto;color:var(--fg-4)}
.sysnote{margin-left:36px;padding:8px 11px;border-radius:9px;font-size:12px;color:var(--fg-2);background:var(--surface-2);border:1px dashed var(--line-strong);display:flex;gap:8px;align-items:flex-start}
.sysnote.human{background:var(--human-soft);border:1px solid color-mix(in srgb,var(--human) 28%,transparent);color:var(--human-ink)}
.sysnote .ic{margin-top:1px}
.composer{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);flex:none}
.composer textarea{width:100%;min-height:58px;max-height:160px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;background:var(--surface);outline:0;line-height:1.45}
.composer textarea:focus,.textarea:focus,.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cmp-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notifychips{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-3);flex:1;min-width:0}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lbl{font-size:11.5px;font-weight:600;color:var(--fg-2)}
.input,.select,.textarea{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 10px;height:32px;outline:0;min-width:0}
.textarea{height:auto;min-height:84px;padding:9px 11px;line-height:1.45;resize:vertical;width:100%}
.select{padding-right:26px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.hint-t{font-size:11.5px;color:var(--fg-3)}
.dtypes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dtype{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 8px;border:1px solid var(--line);border-radius:10px;font-size:11.5px;font-weight:550;color:var(--fg-2);background:var(--surface)}
.dtype:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-2)}
.dtype.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cards{display:grid;gap:6px}
.rcard{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;text-align:left;width:100%;background:var(--surface)}
.rcard:hover{border-color:var(--line-strong)}
.rcard.on{border-color:var(--accent);background:var(--accent-soft)}
.rcard .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;margin-top:2px;display:grid;place-items:center}
.rcard.on .rd{border-color:var(--accent)}
.rcard.on .rd::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.rcard b{font-weight:650}
.rcard span.d{display:block;color:var(--fg-3);font-size:11.5px;margin-top:1px}
.check{display:flex;align-items:flex-start;gap:9px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.preview{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.preview .ph{padding:8px 12px;font:600 10.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.prow{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px}
.prow:last-child{border-bottom:0}
.prow .pw{width:122px;flex:none;display:flex;flex-direction:column;gap:3px}
.prow .pw b{font-weight:650;font-size:12px}
.prow .pt{flex:1;min-width:0;color:var(--fg-2);line-height:1.5;overflow-wrap:anywhere}
.slider{width:100%;accent-color:var(--accent)}
.receipts{display:inline-flex;align-items:center;gap:4px}
.rc{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 5px;border-radius:4px;background:var(--surface-3);color:var(--fg-3)}
.rc.q{background:var(--surface-3);color:var(--fg-3)}
.rc.d{background:var(--wait-soft);color:var(--wait-ink)}
.rc.a{background:var(--ok-soft);color:var(--ok-ink)}
.rc.r{background:var(--accent-soft);color:var(--accent)}
.rc .ic{width:10px;height:10px;stroke-width:2.4}
.brief{font-size:13px;line-height:1.55;color:var(--fg-2)}
.brief h5{margin:14px 0 4px;font:650 12px/1.2 var(--font-ui);color:var(--fg);letter-spacing:.01em}
.brief h5:first-child{margin-top:0}
.brief ul{margin:2px 0 0;padding-left:18px}
.brief li{margin:2px 0}
.brief code{font:500 11.5px var(--font-mono);background:var(--surface-3);padding:1px 5px;border-radius:4px}
.rep{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.rep-h{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12px}
.rep-b{padding:10px 12px;font-size:12.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:6px}
.evi{font:500 11.5px/1.5 var(--font-mono);background:var(--surface-3);border-radius:8px;padding:8px 10px;color:var(--fg-2);overflow-x:auto;white-space:pre}
.comm{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.comm:last-child{border-bottom:0}
.comm .arrow{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fg-3);flex-wrap:wrap}
.comm .arrow b{color:var(--fg);font-weight:650}
.comm .body{font-size:12.5px;color:var(--fg-2);margin-top:3px;line-height:1.5}
.comm .tm{font:500 10.5px var(--font-mono);color:var(--fg-4);width:42px;flex:none;padding-top:2px}

/* ───────────── board ───────────── */
.boardwrap{position:absolute;inset:0;display:flex;flex-direction:column;min-width:0}
.bhead{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.bhead h2{margin:0;font:650 17px var(--font-display);letter-spacing:-.01em}
.bscroll{flex:1;overflow:auto;padding:0 16px 16px;min-height:0}
.bgrid{display:grid;gap:10px;min-width:max-content}
.bcol{display:flex;flex-direction:column;min-width:0;background:color-mix(in srgb,var(--surface-3) 60%,transparent);border-radius:12px;border:1px solid transparent;transition:border-color .15s,background .15s}
.bcol-h{display:flex;align-items:center;gap:8px;padding:10px 11px 8px;font-weight:650;font-size:12.5px;position:sticky;top:0}
.bcol-h .count{margin-left:auto}
.bcol-b{display:flex;flex-direction:column;gap:8px;padding:2px 8px 10px;min-height:60px}
.bcol.drop-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 70%,transparent)}
.bcol.drop-no{border-color:var(--crit);background:color-mix(in srgb,var(--crit-soft) 60%,transparent)}
.bcard{position:relative;display:flex;flex-direction:column;gap:6px;padding:9px 10px 9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);cursor:grab;text-align:left;--st:var(--idle)}
.bcard::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--st)}
.bcard:hover{border-color:var(--line-strong);box-shadow:var(--shadow-2)}
.bcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bcard.dragging{opacity:.4}
.bcard .b-name{font:650 14px/1.15 var(--font-display);letter-spacing:-.01em}
.bcard .b-sub{font-size:11.5px;color:var(--fg-3);line-height:1.35}
.bcard .b-foot{display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap}
.bcard.s-planned{border-style:dashed;box-shadow:none;background:transparent}
.bcard.s-needs{border-color:var(--warn)}
.bcard.s-failed{border-color:var(--crit)}
.mtag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--fg-3);white-space:nowrap}
.mtag i{width:7px;height:7px;border-radius:2px}
.swim{display:grid;gap:10px;margin-bottom:10px;min-width:max-content}
.swimlabel{position:sticky;left:0;z-index:2;display:flex;flex-direction:column;gap:3px;padding:10px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);align-self:stretch}
.swimlabel b{font:650 13px var(--font-display)}
.cell{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:12px;background:color-mix(in srgb,var(--surface-3) 55%,transparent);border:1px solid transparent;min-height:60px;transition:border-color .15s,background .15s}
.cell.drop-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 70%,transparent)}
.cell.drop-no{border-color:var(--crit);background:color-mix(in srgb,var(--crit-soft) 60%,transparent)}
.colhead-row{display:grid;gap:10px;margin-bottom:6px;min-width:max-content;position:sticky;top:0;z-index:3;background:var(--bg);padding-top:2px}
.colhead-row .ch{display:flex;align-items:center;gap:8px;padding:6px 4px;font-weight:650;font-size:12.5px}
.colhead-row .ch .count{margin-left:auto}
.rulebar{margin:0 16px 10px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--fg-3);display:flex;gap:8px;align-items:center}
.more{padding:6px;border-radius:8px;border:1px dashed var(--line-strong);color:var(--fg-3);font-size:12px;text-align:center}
.more:hover{background:var(--surface);color:var(--fg)}

/* ───────────── ledger & needs ───────────── */
.pagewrap{position:absolute;inset:0;overflow:auto}
.page{max-width:980px;margin:0 auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:14px}
.page h2{margin:0;font:650 22px var(--font-display);letter-spacing:-.015em}
.page .lead{color:var(--fg-3);max-width:68ch}
.ptools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lrow{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.lrow>button.lmain{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;width:100%;text-align:left}
.lrow>button.lmain:hover{background:var(--surface-2)}
.lid{font:600 11px var(--font-mono);color:var(--fg-3);width:56px;flex:none;padding-top:2px}
.ltxt{flex:1;min-width:0}
.ltxt b{font-weight:650}
.ltxt .sub{color:var(--fg-3);font-size:12px;margin-top:2px}
.lside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.ldetail{border-top:1px solid var(--line);background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.recip{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px}
.recip .rw{display:flex;flex-direction:column;gap:3px}
.recip .rw b{font-weight:650}
.recip .rt{color:var(--fg-2);line-height:1.5}
.ncard{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow-1)}
.ncard.hot{border-color:var(--warn)}
.ncard.crit{border-color:var(--crit)}
.nhead{display:flex;gap:11px;padding:12px 14px 4px;align-items:flex-start}
.nhead h3{margin:0;font:650 15px/1.25 var(--font-display);letter-spacing:-.01em}
.nbody{padding:4px 14px 10px 59px;display:flex;flex-direction:column;gap:8px;color:var(--fg-2)}
.nfoot{display:flex;gap:8px;align-items:center;padding:10px 14px 12px 59px;flex-wrap:wrap}
.ncard.resolved{opacity:.55}
.ncard.resolved .nfoot .btn{display:none}
.empty{padding:36px 20px;text-align:center;color:var(--fg-3);border:1px dashed var(--line-strong);border-radius:14px}

/* ───────────── overlays ───────────── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:grid;place-items:center;padding:20px;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-pop);width:min(1100px,100%);max-height:min(860px,100%);display:flex;flex-direction:column;overflow:hidden;animation:rise .2s cubic-bezier(.2,.7,.2,1)}
.modal.md{width:min(720px,100%)}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font:650 18px var(--font-display);letter-spacing:-.015em}
.mbody{flex:1;overflow:auto;min-height:0}
.mfoot{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-pop);animation:rise .14s ease-out;max-width:calc(100vw - 20px);max-height:calc(100vh - 20px);overflow:auto}
.pop .ph{padding:11px 14px 8px;font:650 14px var(--font-display);letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between}
.pop .pb{padding:4px 14px 12px;display:flex;flex-direction:column;gap:10px}
.pop .pf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:90;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:11px;box-shadow:var(--shadow-pop);font-weight:550;max-width:min(560px,92vw);display:flex;gap:9px;align-items:flex-start;animation:rise .2s ease-out;pointer-events:auto}
.toast.out{opacity:0;transform:translateY(6px);transition:all .25s}
.toast .ic{margin-top:1px;flex:none}
.toast.warn{background:var(--warn);color:#fff}
.toast .t2{font-weight:450;opacity:.85;font-size:12px;margin-top:1px}

/* ───────────── model studio ───────────── */
.studio{display:grid;grid-template-columns:minmax(380px,1.15fr) minmax(320px,1fr);min-height:0;height:100%}
.studio-l{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.studio-r{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface-2)}
.st-top{display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);flex:none}
.slots{flex:1;overflow:auto;padding:6px 10px 12px;min-height:0}
.slotgroup{font:600 10.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);padding:14px 8px 6px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 10px;border-radius:11px;border:1px solid transparent;text-align:left;width:100%;align-items:center}
.slot:hover{background:var(--surface-2)}
.slot.on{background:var(--accent-soft);border-color:var(--accent-line)}
.slot .sn{font-weight:650;display:flex;align-items:center;gap:7px}
.slot .sd{grid-column:1;color:var(--fg-3);font-size:11.5px;line-height:1.35}
.slot .sv{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.slot.unset .sv .mchip{border-color:var(--warn);color:var(--warn-ink);background:var(--warn-soft);border-style:dashed}
.uses{font-size:10.5px;color:var(--fg-4)}
.cat-top{padding:12px 16px 8px;display:flex;flex-direction:column;gap:10px;flex:none}
.cat-list{flex:1;overflow:auto;padding:0 10px 10px;min-height:0}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;width:100%;text-align:left;border:1px solid transparent}
.mrow:hover{background:var(--surface)}
.mrow.on{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mrow .mi{flex:1;min-width:0}
.mrow .mi b{font-weight:650;display:flex;align-items:center;gap:6px}
.mrow .mi>span{font:500 11px var(--font-mono);color:var(--fg-3)}
.provh{font:600 10.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);padding:12px 10px 6px;display:flex;align-items:center;gap:7px}
.reasons{display:flex;flex-wrap:wrap;gap:4px}
.reasons button{height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--line-strong);font:500 11.5px var(--font-mono);background:var(--surface);color:var(--fg-2)}
.reasons button:hover{border-color:var(--fg-4)}
.reasons button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat-foot{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);flex:none;display:flex;flex-direction:column;gap:9px}
.forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* wizard */
.wiz{display:flex;flex-direction:column;height:100%;min-height:0}
.steps{display:flex;gap:0;padding:0 18px;border-bottom:1px solid var(--line);flex:none;background:var(--surface-2)}
.stp{display:flex;align-items:center;gap:9px;padding:12px 14px 12px 0;margin-right:14px;color:var(--fg-3);font-weight:550;position:relative}
.stp .nb{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--font-mono);background:var(--surface-3);color:var(--fg-2)}
.stp.on{color:var(--fg)}
.stp.on .nb{background:var(--accent);color:var(--accent-ink)}
.stp.done .nb{background:var(--ok);color:#fff}
.stp.done{color:var(--fg-2)}
.wbody{flex:1;overflow:auto;min-height:0}
.wpad{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.briefarea{min-height:300px;font:500 12.5px/1.6 var(--font-mono);white-space:pre-wrap;overflow-x:hidden;overflow-y:auto}
.grp{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.grp-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.grp-h b{font:650 14px var(--font-display)}
.approw{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.approw:last-child{border-bottom:0}
.plt{display:inline-flex;gap:3px}
.plt i{font:600 9.5px/1 var(--font-mono);font-style:normal;padding:3px 5px;border-radius:4px;background:var(--surface-3);color:var(--fg-2);letter-spacing:.02em}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tot{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tot b{display:block;font:650 22px/1.1 var(--font-display);letter-spacing:-.02em}
.tot span{font-size:11.5px;color:var(--fg-3)}
.numstep{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.numstep button{width:28px;height:30px;display:grid;place-items:center;color:var(--fg-2)}
.numstep button:hover{background:var(--surface-3)}
.numstep b{min-width:32px;text-align:center;font:600 13px var(--font-mono)}
.obs-note{position:absolute;z-index:3}

/* top bar gives things up in this order as the window narrows */
@media (max-width:1720px){.runsw .rs-sub{display:none}}
@media (max-width:1590px){.chip .lbl-hide{display:none}.sample-tag .st-long{display:none}}
@media (max-width:1390px){.tab{padding:0 9px}.brand .wm{display:none}.brand{margin-right:0}}
@media (max-width:1310px){.sample-tag .st-mid{display:none}}
@media (max-width:1270px){.btn .btn-lbl,.chip .fc{display:none}}
@media (max-width:1150px){.tab .tl{display:none}}
@media (max-width:1000px){.tab{padding:0 6px}.topbar{gap:4px}}
@media (max-width:930px){.sample-tag{display:none}}
@container (max-width:1250px){.ctl.br{display:none}}
@media (max-width:1100px){
  .inspector{position:absolute;right:0;top:0;bottom:0;box-shadow:var(--shadow-pop);--insp-w:min(460px,92vw)}
  .main{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .studio{grid-template-columns:1fr}
  .studio-l{border-right:0;border-bottom:1px solid var(--line)}
  .recip{grid-template-columns:1fr}
}

function nowText(n, app, nodes) {

}

function resolveCascade(targetId, cascade) {

/* recipients = direct targets + the whole ancestor chain. parent: full · above: digest · orchestrator: always in world state */
function buildRecipients(d) {
  const out = []; const seen = new Set();
  const affected = d.affected || [d.target];
  const direct = affected.length > 6 ? [d.target] : affected;
  direct.forEach(id => { if (!seen.has(id)) { seen.add(id); out.push({ id, level: 'direct', state: 'queued' }); } });
  const parents = new Set(affected.map(id => S.nodes[id]?.parent).filter(Boolean));
  const chain = new Set();
  affected.forEach(id => ancestors(id).forEach(a => chain.add(a)));
  /* when cascading over many nodes the target's own ancestors are enough */
  [...chain].forEach(id => {
    if (seen.has(id)) { const r = out.find(x => x.id === id); if (r && parents.has(id) && r.level !== 'direct') r.level = 'full'; return; }
    seen.add(id);
    out.push({ id, level: parents.has(id) || id === S.nodes[d.target]?.parent ? 'full' : 'digest', state: 'queued' });
  });
  const o = out.find(r => r.id === 'orch');
  if (o) o.world = true;
  else out.push({ id: 'orch', level: 'digest', world: true, state: 'queued' });
  if (affected.length > direct.length) out.push({ id: '*', level: 'direct', group: affected.length - direct.length, state: 'queued' });
  return out;
}

  if (n.rk === 'review') return { obj: `Independently review the merged ${a.name} branch against ACCEPTANCE.md and the CONTRACT.`, del: ['A verdict: PASS / PASS with nits / FAIL', 'Findings with file and line evidence', 'A short list of what you did not check'], bounds: ['Read-only on source', 'Do not fix — report'], inputs: ['ACCEPTANCE.md', 'CONTRACT.md', 'The merged diff', 'Deterministic check results'], acc: ['Every FAIL names evidence', 'Verdict states what was and was not verified'] };
  if (n.rk === 'slop') return { obj: `Find AI slop in ${a.name}: filler, fakes, dead code, invented APIs and unverifiable claims.`, del: ['Verdict with evidence per finding', 'Zero-tolerance hits listed first', 'Fix list for the lead'], bounds: ['Read-only on source', 'A finding needs a file, a line and a reason'], inputs: ['helm_slop_scan output', 'README and store copy', 'Dependency manifest'], acc: ['No placeholder, TODO or lorem on a shipped path', 'Every dependency exists and is used', 'Every README claim matches the code'] };
  return { obj: label, del: [], bounds: [], inputs: [], acc: [] };
}

function reportsFor(n) {
  const a = appOf(n); const out = [];
  if (n.status === 'planned' || n.status === 'queued') return out;
  const hv = hash(n.id);
  if (n.kind === 'orch' || n.kind === 'mgr') {
    out.push({ n: 1, t: ago(60), title: n.kind === 'orch' ? 'Portfolio status' : `${n.sub} rollup`, sum: n.now, ev: n.kind === 'orch' ? 'apps  20   managers 5   leads 20\nspawned ' + spawnedCount() + '   running ' + runningCount() + '   queued ' + queuedCount() : S.mgrById[n.mgrId].apps.map(id => S.appById[id].name.padEnd(10) + stageLabel(S.appById[id].stage)).join('\n'), next: 'Re-plan after the next stage change.' });
    return out;
  }
  const k = Math.max(1, Math.min(3, 1 + hv % 3));
  for (let i = 1; i <= k; i++) {
    out.push({
      n: i, t: ago(Math.max(4, 150 - i * 45)),
      title: n.kind === 'gate' ? (i === 1 ? 'Gate report' : 'Re-check') : i === k && n.status === 'done' ? 'Final report' : `Progress report ${i}`,
      sum: n.kind === 'gate' ? (n.status === 'done' ? 'PASS — no blocking findings.' : 'In progress — first findings soon.') : `Completed ${i * 25 + hv % 20}% of the brief. ${i === k && n.status === 'running' ? 'Continuing with ' + n.now.toLowerCase() : 'No blockers.'}`,
      ev: n.kind === 'gate' ? `files read  ${40 + hv % 60}\nfindings    ${n.status === 'done' ? 0 : 1 + hv % 3}\nnot checked iOS 17 simulator` : `commits     ${i * 2 + hv % 3}\ndiff        +${120 * i + hv % 90} −${hv % 40}\nchecks      lint ✓  types ✓  tests ${30 + i * 18 + hv % 20} ✓`,
      next: n.kind === 'gate' ? 'Report to the lead.' : i === k && n.status === 'done' ? 'Hand off to the lead for merge.' : 'Keep going; ask the lead about contract drift.',
    });
  }
  return out.reverse();
}

function timelineFor(n) {
  if (n.kind === 'orch') return [[0, 'Idle · waiting for digests'], [10, 'Status written to PORTFOLIO.md'], [31, 'Proposed wave 4'], [96, 'Policy D-0409 applied'], [236, 'Run started']].map(([m, e]) => ({ t: ago(m), e }));
  const ev = [];
  if (n.status === 'planned') return [{ t: NOWMS, e: 'Planned — waiting for the lead' }];
  ev.push({ t: ago(n.started), e: 'thread.created' });
  ev.push({ t: ago(n.started - 2), e: 'thread.active' });
  if (n.status === 'done') ev.push({ t: ago(14), e: 'thread.idle — last assistant text captured' });
  if (n.status === 'failed') ev.push({ t: ago(18), e: 'turn.failed — rate limit (429)' });
  if (n.status === 'needs') ev.push({ t: ago(5), e: 'interaction.pending' });
  if (n.status === 'running') ev.push({ t: ago(3), e: 'thread.active — new turn' });
  if (n.status === 'queued') ev.push({ t: ago(5), e: 'message.queued — waiting on capacity' });
  n.touchedBy.forEach(id => { const d = S.ledger.find(x => x.id === id); if (d) ev.push({ t: d.t, e: `${d.id} ${TYPE_LABEL[d.type] || d.type} by you` }); });
  return ev.sort((a, b) => b.t - a.t);
}

'use strict';
/* ════════════════════════════════════════════════════════════════
   Graph: layout, render, pan/zoom, action bar, propagation animation
   ════════════════════════════════════════════════════════════════ */

const G = { zoom: 1, px: 0, py: 0, auto: true, L: null, pan: null, fxTimers: [] };
const D = {
  orch: { w: 216, h: 110 }, mgr: { w: 224, h: 106 }, app: { w: 206, h: 82 }, gx: 64, gy: 12, cgap: 30, cols: 2,
  W1: 232, nw: 224, nh: 92, ng: 10, pad: 14, head: 22,
};

/* ───────── layout ───────── */
function portfolioLayout() {
  const R = {}, edges = [], clusters = [], labels = [];
  const cl = S.mgrs.map(m => {
    const apps = S.collapsed[m.id] ? [] : m.apps.map(id => S.appById[id]);
    const rows = Math.ceil(apps.length / D.cols);
    const gridH = rows ? rows * D.app.h + (rows - 1) * D.gy : 0;
    return { m, apps, gridH, h: Math.max(D.mgr.h, gridH) + 28 };
  });
  const total = cl.reduce((a, c) => a + c.h, 0) + D.cgap * (cl.length - 1);
  const xMgr = D.orch.w + D.gx;
  const xApp = xMgr + D.mgr.w + D.gx;
  let y = 0, maxR = xMgr + D.mgr.w;
  cl.forEach(c => {
    const cy = y + c.h / 2;
    R[c.m.id] = { x: xMgr, y: cy - D.mgr.h / 2, w: D.mgr.w, h: D.mgr.h };
    c.apps.forEach((a, i) => {
      const col = i % D.cols, row = Math.floor(i / D.cols);
      R[a.id] = { x: xApp + col * (D.app.w + 10), y: cy - c.gridH / 2 + row * (D.app.h + D.gy), w: D.app.w, h: D.app.h };
      edges.push({ from: c.m.id, to: a.id, kind: 'app' });
    });
    const right = c.apps.length ? xApp + Math.min(D.cols, c.apps.length) * (D.app.w + 10) - 10 + 14 : xMgr + D.mgr.w + 14;
    maxR = Math.max(maxR, right);
    clusters.push({ id: 'cl-' + c.m.id, x: xMgr - 14, y, w: right - (xMgr - 14), h: c.h, label: `${c.m.name} · ${plural(c.m.apps.length, 'app')}`, hue: c.m.hue });
    edges.push({ from: 'orch', to: c.m.id, kind: 'mgr' });
    y += c.h + D.cgap;
  });
  R.orch = { x: 0, y: total / 2 - D.orch.h / 2, w: D.orch.w, h: D.orch.h };
  let h = total;
  if (S.observatory) {
    const oy = total + 54;
    labels.push({ x: xMgr - 14, y: oy - 24, text: `Outside this run · ${Object.keys(S.obs).length} threads in 5 projects · read-only` });
    Object.values(S.obs).forEach((o, i) => { R[o.id] = { x: xMgr - 14 + (i % 3) * (D.app.w + 12), y: oy + Math.floor(i / 3) * 96, w: D.app.w, h: 84 }; });
    h = oy + 2 * 96;
  }
  return { rects: R, edges, clusters, labels, deco: [], frames: {}, bounds: { w: maxR + 4, h } };
}

function squadLayout(appId) {
  const a = S.appById[appId];
  const R = {}, edges = [], clusters = [], deco = [], frames = {};
  const { W1, nw, nh, ng, pad, head } = D;
  const rows = Math.ceil(a.specs.length / 2);
  const sfW = nw * 2 + ng + pad * 2, sfH = head + rows * nh + (rows - 1) * ng + pad * 2;
  const gfH = head + nh + pad * 2, gap = 44;
  const x2 = W1 + 64, totalH = sfH + gap + gfH, gfY = sfH + gap;
  const run = a.specs.filter(id => S.nodes[id].status === 'running').length;
  clusters.push({ id: 'sf', x: x2, y: 0, w: sfW, h: sfH, label: `Specialists · ${a.specs.length}${run ? ' · ' + run + ' running' : ''}`, hue: S.mgrById[a.mgr].hue });
  frames.sf = { x: x2, y: 0, w: sfW, h: sfH };
  a.specs.forEach((id, i) => { R[id] = { x: x2 + pad + (i % 2) * (nw + ng), y: head + pad + Math.floor(i / 2) * (nh + ng), w: nw, h: nh }; });
  clusters.push({ id: 'gf', x: x2, y: gfY, w: sfW, h: gfH, label: 'Quality gates · spawned on demand', dashed: true });
  frames.gf = { x: x2, y: gfY, w: sfW, h: gfH };
  R[a.review] = { x: x2 + pad, y: gfY + head + pad, w: nw, h: nh };
  R[a.slop] = { x: x2 + pad + nw + ng, y: gfY + head + pad, w: nw, h: nh };
  const leadH = 136, chipH = 46, vg = 28;
  const leadY = totalH / 2 - leadH / 2;
  R[a.lead] = { x: 0, y: leadY, w: W1, h: leadH };
  R[a.mgr] = { x: 0, y: leadY - vg - chipH, w: W1, h: chipH };
  R.orch = { x: 0, y: leadY - vg - chipH - vg - chipH, w: W1, h: chipH };
  edges.push({ from: 'orch', to: a.mgr, kind: 'v' }, { from: a.mgr, to: a.lead, kind: 'v' });
  edges.push({ from: a.lead, to: 'sf', kind: 'frame' }, { from: a.lead, to: 'gf', kind: 'gate' });
  deco.push({ x: x2 + sfW / 2, y1: sfH + 6, y2: gfY - 6, text: 'integrate → review → slop check' });
  return { rects: R, edges, clusters, labels: [], deco, frames, bounds: { w: x2 + sfW, h: totalH } };
}

const rectOf = id => G.L.rects[id] || G.L.frames[id];

function pathD(a, b, kind) {
  if (kind === 'v') {
    const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y, d = Math.max(10, (y2 - y1) / 2);
    return `M${x1} ${y1} C${x1} ${y1 + d} ${x2} ${y2 - d} ${x2} ${y2}`;
  }
  const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, d = Math.max(28, (x2 - x1) * 0.5);
  return `M${x1} ${y1} C${x1 + d} ${y1} ${x2 - d} ${y2} ${x2} ${y2}`;
}

/* ───────── node markup ───────── */

}
const needsFor = pred => S.needs.filter(n => !n.done && pred(S.nodes[n.node])).length;

function appCardHTML(a, r) {
  const st = appStatus(a);
  const dots = a.members.map(mid => { const m = S.nodes[mid]; return `<i class="dot s-${m.status}${m.touched ? ' touched' : ''}" title="${esc(m.label)} · ${ST[m.status]}"></i>`; }).join('');

function tierHTML(n, r) {
  const isM = n.kind === 'mgr';

  return `<div class="node tier s-${n.status}" data-id="${n.id}" data-k="${n.kind}" tabindex="0" role="button" aria-label="${esc(nodeLabel(n))}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px">

function chipHTML(n, r) {

function agentHTML(n, r) {

function ghostHTML(o, r) {
  return `<div class="node ghostn s-${o.status}" data-id="${o.id}" data-k="ghost" tabindex="0" role="button" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px">

    ${modelChip(o.model)}

function nodeMarkup(id, r, mode) {
  if (S.obs[id]) return ghostHTML(S.obs[id], r);
  if (mode === 'portfolio' && S.appById[id]) return appCardHTML(S.appById[id], r);
  const n = S.nodes[id];
  if (n.kind === 'orch' || n.kind === 'mgr') return mode === 'squad' ? chipHTML(n, r) : tierHTML(n, r);
  return agentHTML(n, r);
}

function edgeStatus(e) {
  if (e.kind === 'app') { const st = appStatus(S.appById[e.to]); return st === 'running' ? 'run' : st === 'queued' ? 'plan' : ''; }
  if (e.kind === 'mgr') return S.nodes[e.to].status === 'waiting' && S.mgrById[e.to].apps.some(a => appStatus(S.appById[a]) === 'running') ? 'run' : '';
  if (e.kind === 'frame') return S.appById[S.drill].specs.some(id => S.nodes[id].status === 'running') ? 'run' : '';
  if (e.kind === 'gate') return [S.appById[S.drill].review, S.appById[S.drill].slop].some(id => S.nodes[id].status === 'running') ? 'run' : 'plan';
  return 'chain';
}

function renderGraph() {
  if (!$('#stage')) return;
  const mode = S.drill ? 'squad' : 'portfolio';
  const L = S.drill ? squadLayout(S.drill) : portfolioLayout();
  G.L = L;
  let h = '';
  h += L.clusters.map(c => `<div class="cluster" data-cl="${c.id}" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;${c.dashed ? 'border-style:dashed;' : ''}${c.hue ? `border-color:color-mix(in srgb,${c.hue} 38%,var(--line));` : ''}"><span class="cl-label" ${c.hue ? `style="color:${c.hue}"` : ''}>${esc(c.label)}</span></div>`).join('');
  h += L.labels.map(l => `<div class="zone-label" style="left:${l.x}px;top:${l.y}px">${esc(l.text)}</div>`).join('');
  h += `<svg class="edges" width="${L.bounds.w + 40}" height="${L.bounds.h + 40}">`
    + `<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--fg-4)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--fg-4)"/></marker></defs>`
    + L.edges.map(e => {
      const a = rectOf(e.from), b = rectOf(e.to); if (!a || !b) return '';
      let cls = edgeStatus(e);
      if (e.kind === 'gate') cls += ' gate';
      if (e.kind === 'v') cls = 'chain';
      const tn = S.nodes[e.to];
      if (tn && tn.touched) cls += ' touch';
      return `<path class="${cls}" data-e="${e.from}|${e.to}" d="${pathD(a, b, e.kind === 'v' ? 'v' : '')}"/>`;
    }).join('')
    + L.deco.map(d => `<path d="M${d.x} ${d.y1} L${d.x} ${d.y2}" marker-end="url(#arr)" style="stroke:var(--fg-4);stroke-dasharray:3 4"/>`).join('')
    + `</svg>`;
  h += L.deco.map(d => `<div class="zone-label" style="left:${d.x + 12}px;top:${(d.y1 + d.y2) / 2 - 6}px">${esc(d.text)}</div>`).join('');
  h += Object.entries(L.rects).map(([id, r]) => nodeMarkup(id, r, mode)).join('');
  h += `<div id="fx"></div><div class="abar" id="abar" hidden></div>`;
  $('#stage').innerHTML = h;
  renderGraphChrome();
  markSelection();
  applyFilterClasses();
  updateActionBar();
}

function visIdOf(id) {
  if (G.L.rects[id]) return id;
  const n = S.nodes[id];
  if (n && n.appId && !S.drill && G.L.rects[n.appId]) return n.appId;
  return null;
}
function selRectId() { return visIdOf(S.sel); }

function markSelection() {
  const sel = S.sel; const app = S.nodes[sel]?.appId;

}
